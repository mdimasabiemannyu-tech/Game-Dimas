<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario Canvas Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
      color: #ff3131;
      text-shadow: 2px 2px 0px #000;
    }
    .game-container {
      position: relative;
      border: 4px solid #fff;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #6b8cff;
    }
    .ui-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
    }
    .controls-hint {
      margin-top: 15px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }
    .btn-restart {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-restart:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <h1>SUPER MARIO BROS CANVAS</h1>
  
  <div class="game-container">
    <div class="ui-overlay">
      <div id="score">SKOR: 0</div>
      <div id="status"></div>
    </div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>

  <div class="controls-hint">
    Gunakan tombol <strong>A / D</strong> atau <strong>Panah Kiri / Kanan</strong> untuk bergerak, dan <strong>Spasi / Panah Atas / W</strong> untuk melompat.
  </div>
  <button class="btn-restart" onclick="resetGame()">Main Lagi / Reset</button>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const statusEl = document.getElementById('status');

    let score = 0;
    let gameOver = false;
    let gameWon = false;
    let cameraX = 0;

    const keys = {
      right: false,
      left: false,
      up: false
    };

    const player = {
      x: 50,
      y: 200,
      width: 30,
      height: 40,
      vx: 0,
      vy: 0,
      speed: 4,
      gravity: 0.5,
      jumpStrength: -11,
      grounded: false,
      color: '#ff0000'
    };

    const platforms = [
      { x: 0, y: 350, width: 700, height: 50 },
      { x: 800, y: 350, width: 600, height: 50 },
      { x: 1500, y: 350, width: 800, height: 50 },
      { x: 200, y: 240, width: 100, height: 20 },
      { x: 350, y: 180, width: 80, height: 20 },
      { x: 500, y: 240, width: 100, height: 20 },
      { x: 900, y: 240, width: 120, height: 20 },
      { x: 1100, y: 180, width: 100, height: 20 },
      { x: 1600, y: 250, width: 100, height: 20 },
      { x: 1800, y: 200, width: 100, height: 20 }
    ];

    let coins = [
      { x: 220, y: 200, radius: 8, collected: false },
      { x: 250, y: 200, radius: 8, collected: false },
      { x: 375, y: 140, radius: 8, collected: false },
      { x: 520, y: 200, radius: 8, collected: false },
      { x: 920, y: 200, radius: 8, collected: false },
      { x: 950, y: 200, radius: 8, collected: false },
      { x: 1130, y: 140, radius: 8, collected: false },
      { x: 1630, y: 210, radius: 8, collected: false },
      { x: 1830, y: 160, radius: 8, collected: false }
    ];

    let enemies = [
      { x: 400, y: 320, width: 30, height: 30, vx: -1.5, minX: 300, maxX: 650, alive: true },
      { x: 1000, y: 320, width: 30, height: 30, vx: -2, minX: 850, maxX: 1300, alive: true },
      { x: 1700, y: 320, width: 30, height: 30, vx: -2, minX: 1550, maxX: 2100, alive: true }
    ];

    const flag = {
      x: 2200,
      y: 150,
      width: 10,
      height: 200
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
        if (!keys.up && player.grounded) {
          player.vy = player.jumpStrength;
          player.grounded = false;
        }
        keys.up = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.up = false;
    });

    function update() {
      if (gameOver || gameWon) return;

      if (keys.right) player.vx = player.speed;
      else if (keys.left) player.vx = -player.speed;
      else player.vx = 0;

      player.vy += player.gravity;
      player.x += player.vx;
      player.y += player.vy;

      player.grounded = false;
      for (let plat of platforms) {
        if (
          player.x < plat.x + plat.width &&
          player.x + player.width > plat.x &&
          player.y + player.height >= plat.y &&
          player.y + player.height <= plat.y + plat.height &&
          player.vy >= 0
        ) {
          player.y = plat.y - player.height;
          player.vy = 0;
          player.grounded = true;
        }
      }

      if (player.y > canvas.height + 100) {
        endGame(false);
      }

      cameraX = player.x - 200;
      if (cameraX < 0) cameraX = 0;

      for (let enemy of enemies) {
        if (!enemy.alive) continue;

        enemy.x += enemy.vx;
        if (enemy.x <= enemy.minX || enemy.x + enemy.width >= enemy.maxX) {
          enemy.vx *= -1;
        }

        if (
          player.x < enemy.x + enemy.width &&
          player.x + player.width > enemy.x &&
          player.y < enemy.y + enemy.height &&
          player.y + player.height > enemy.y
        ) {
          if (player.vy > 0 && player.y + player.height - player.vy <= enemy.y + 10) {
            enemy.alive = false;
            player.vy = player.jumpStrength * 0.7;
            score += 200;
          } else {
            endGame(false);
          }
        }
      }

      for (let coin of coins) {
        if (!coin.collected) {
          let dist = Math.hypot((player.x + player.width / 2) - coin.x, (player.y + player.height / 2) - coin.y);
          if (dist < coin.radius + player.width / 2) {
            coin.collected = true;
            score += 100;
          }
        }
      }

      if (
        player.x + player.width >= flag.x &&
        player.x <= flag.x + flag.width &&
        player.y + player.height >= flag.y
      ) {
        endGame(true);
      }

      scoreEl.innerText = `SKOR: ${score}`;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(-cameraX, 0);

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(150, 80, 20, 0, Math.PI * 2);
      ctx.arc(170, 70, 25, 0, Math.PI * 2);
      ctx.arc(190, 80, 20, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(650, 100, 20, 0, Math.PI * 2);
      ctx.arc(670, 90, 25, 0, Math.PI * 2);
      ctx.arc(690, 100, 20, 0, Math.PI * 2);
      ctx.fill();

      for (let plat of platforms) {
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
        
        ctx.fillStyle = '#228B22';
        ctx.fillRect(plat.x, plat.y, plat.width, 6);
      }

      for (let coin of coins) {
        if (!coin.collected) {
          ctx.fillStyle = '#FFD700';
          ctx.beginPath();
          ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#DAA520';
          ctx.stroke();
        }
      }

      for (let enemy of enemies) {
        if (enemy.alive) {
          ctx.fillStyle = '#a52a2a';
          ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
          
          ctx.fillStyle = '#fff';
          ctx.fillRect(enemy.x + 4, enemy.y + 6, 6, 8);
          ctx.fillRect(enemy.x + 18, enemy.y + 6, 6, 8);
          ctx.fillStyle = '#000';
          ctx.fillRect(enemy.x + 6, enemy.y + 8, 3, 4);
          ctx.fillRect(enemy.x + 20, enemy.y + 8, 3, 4);
        }
      }

      ctx.fillStyle = '#ccc';
      ctx.fillRect(flag.x, flag.y, flag.width, flag.height);
      ctx.fillStyle = '#ff0000';
      ctx.beginPath();
      ctx.moveTo(flag.x + flag.width, flag.y);
      ctx.lineTo(flag.x + flag.width + 40, flag.y + 20);
      ctx.lineTo(flag.x + flag.width, flag.y + 40);
      ctx.fill();

      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y + 12, player.width, player.height - 12);
      ctx.fillStyle = '#0000ff';
      ctx.fillRect(player.x + 4, player.y + 22, player.width - 8, player.height - 22);
      ctx.fillStyle = '#ffcc99';
      ctx.fillRect(player.x + 4, player.y + 2, player.width - 8, 12);
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(player.x + 2, player.y, player.width - 4, 6);

      ctx.restore();
    }

    function endGame(win) {
      if (win) {
        gameWon = true;
        statusEl.innerText = "SELAMAT! KAMU MENANG!";
        statusEl.style.color = "#00ff00";
      } else {
        gameOver = true;
        statusEl.innerText = "GAME OVER!";
        statusEl.style.color = "#ff0000";
      }
    }

    function resetGame() {
      player.x = 50;
      player.y = 200;
      player.vx = 0;
      player.vy = 0;
      score = 0;
      gameOver = false;
      gameWon = false;
      cameraX = 0;
      statusEl.innerText = "";

      coins.forEach(c => c.collected = false);
      enemies[0].alive = true; enemies[0].x = 400;
      enemies[1].alive = true; enemies[1].x = 1000;
      enemies[2].alive = true; enemies[2].x = 1700;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
