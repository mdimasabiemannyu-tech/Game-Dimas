<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Dragon Snake Battle</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

body{
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#menu{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#080808,#171717);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:20;
  padding:20px;
}

#menu h1{
  font-size:38px;
  color:#ffd400;
  text-shadow:0 0 20px #ff8c00;
  margin-bottom:10px;
}

#menu p{
  color:#aaa;
  margin-bottom:25px;
}

input{
  width:280px;
  padding:14px;
  border:none;
  border-radius:12px;
  text-align:center;
  font-size:18px;
  margin-bottom:15px;
  outline:none;
}

button{
  border:none;
  border-radius:12px;
  padding:12px 20px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.startBtn{
  background:#ffd400;
  color:#111;
  box-shadow:0 0 20px #ff9d00;
}

#game{
  display:none;
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  background:#101010;
}

#topUI{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  z-index:5;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.panel{
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.12);
  padding:9px 12px;
  border-radius:12px;
  font-size:14px;
}

#shopBtn{
  pointer-events:auto;
  background:#ffb400;
  color:#111;
  padding:9px 14px;
}

#powerUI{
  position:fixed;
  top:72px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  display:flex;
  gap:5px;
  font-size:12px;
}

.power{
  background:rgba(0,0,0,.65);
  padding:6px 9px;
  border-radius:8px;
  display:none;
}

#joystick{
  position:fixed;
  left:25px;
  bottom:30px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.2);
  z-index:8;
  touch-action:none;
}

#stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,200,0,.75);
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

#boostBtn{
  position:fixed;
  right:30px;
  bottom:45px;
  width:85px;
  height:85px;
  border-radius:50%;
  background:#ff8c00;
  color:white;
  font-size:15px;
  z-index:8;
  box-shadow:0 0 25px rgba(255,120,0,.6);
  touch-action:none;
}

#shop,
#gameOver{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  z-index:30;
  display:none;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.modal{
  width:min(420px,95vw);
  background:#151515;
  border:1px solid #333;
  border-radius:20px;
  padding:22px;
  text-align:center;
  box-shadow:0 0 40px rgba(0,0,0,.8);
}

.modal h2{
  color:#ffd400;
  margin-bottom:15px;
}

.shopItem{
  background:#222;
  margin:9px 0;
  padding:13px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.shopItem button{
  background:#ffd000;
  color:#111;
  padding:8px 12px;
}

.closeBtn{
  margin-top:15px;
  background:#444;
  color:white;
}

#leaderboard{
  margin-top:10px;
  text-align:left;
  font-size:12px;
  color:#ccc;
}

@media(max-width:600px){
  #menu h1{
    font-size:30px;
  }

  .panel{
    font-size:12px;
    padding:7px 9px;
  }

  #joystick{
    width:110px;
    height:110px;
  }

  #boostBtn{
    width:75px;
    height:75px;
    right:20px;
    bottom:35px;
  }
}
</style>
</head>

<body>

<div id="menu">
  <h1>🐉 DRAGON SNAKE</h1>
  <p>Battle • Survive • Become the Biggest</p>

  <input id="nameInput" maxlength="15" placeholder="Nama pemain">

  <button class="startBtn" onclick="startGame()">
    MULAI GAME
  </button>
</div>

<div id="game">

<canvas id="canvas"></canvas>

<div id="topUI">

  <div class="panel">
    🐉 <b id="playerName">Player</b><br>
    Score: <b id="scoreText">0</b><br>
    Level: <b id="levelText">1</b><br>
    🪙 <b id="coinText">0</b>
  </div>

  <button id="shopBtn" onclick="openShop()">🛒 SHOP</button>

</div>

<div id="powerUI">
  <div class="power" id="magnetUI">🧲 <span></span></div>
  <div class="power" id="zoomUI">🔭 <span></span></div>
  <div class="power" id="bonusUI">💰 5× <span></span></div>
  <div class="power" id="speedUI">⚡ 2× <span></span></div>
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="boostBtn">⚡ BOOST</button>

</div>

<div id="shop">

  <div class="modal">
    <h2>🛒 SHOP</h2>

    <div style="margin-bottom:12px">
      🪙 Koin: <b id="shopCoins">0</b>
    </div>

    <div class="shopItem">
      <span>🧲 Magnet<br><small>Tarik item dari jauh</small></span>
      <button onclick="buyPower('magnet',50)">50 🪙</button>
    </div>

    <div class="shopItem">
      <span>🔭 Zoom<br><small>Penglihatan lebih luas</small></span>
      <button onclick="buyPower('zoom',80)">80 🪙</button>
    </div>

    <div class="shopItem">
      <span>💰 Bonus 5×<br><small>Nilai makanan & koin</small></span>
      <button onclick="buyPower('bonus',100)">100 🪙</button>
    </div>

    <div class="shopItem">
      <span>⚡ Speed 2×<br><small>Kecepatan meningkat</small></span>
      <button onclick="buyPower('speed',100)">100 🪙</button>
    </div>

    <button class="closeBtn" onclick="closeShop()">TUTUP</button>
  </div>

</div>

<div id="gameOver">

  <div class="modal">
    <h2>💀 GAME OVER</h2>

    <p id="finalText"></p>

    <div id="leaderboard"></div>

    <br>

    <button class="startBtn" onclick="restartGame()">
      MAIN LAGI
    </button>

    <button class="closeBtn" onclick="backMenu()">
      MENU
    </button>
  </div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W,H;

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
}

window.addEventListener("resize",resize);
resize();

const WORLD=5000;

let player;
let enemies=[];
let foods=[];
let coins=[];
let particles=[];

let running=false;
let gameTime=0;

let wallet=parseInt(localStorage.getItem("dragonCoins")||"0");

let magnetTime=0;
let zoomTime=0;
let bonusTime=0;
let speedTime=0;

let joystickX=0;
let joystickY=0;

let boost=false;

const keys={};

document.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;

  if(e.code==="Space"){
    boost=true;
    e.preventDefault();
  }
});

document.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;

  if(e.code==="Space"){
    boost=false;
  }
});


// =========================
// PLAYER
// =========================

function createPlayer(){

  let x=WORLD/2;
  let y=WORLD/2;

  player={
    x:x,
    y:y,

    angle:0,

    radius:17,

    speed:2.7,

    score:0,

    body:[],

    color:"#00d9ff",

    name:document.getElementById("nameInput").value.trim() || "Player"
  };

  for(let i=0;i<35;i++){

    player.body.push({
      x:x-i*8,
      y:y
    });

  }
}


// =========================
// ENEMY
// =========================

function createEnemy(i){

  let angle=Math.random()*Math.PI*2;
  let distance=700+Math.random()*1300;

  let x=player.x+Math.cos(angle)*distance;
  let y=player.y+Math.sin(angle)*distance;

  x=Math.max(200,Math.min(WORLD-200,x));
  y=Math.max(200,Math.min(WORLD-200,y));

  let level=playerLevel();

  let enemyScore=
    170+
    level*45+
    Math.random()*180;

  let enemy={
    x:x,
    y:y,

    angle:Math.random()*Math.PI*2,

    radius:17+Math.random()*3,

    score:enemyScore,

    body:[],

    color:[
      "#ff3030",
      "#ff7b00",
      "#b400ff",
      "#00ff66",
      "#ff1493"
    ][i%5],

    // AI STATE
    targetX:x,
    targetY:y,

    thinkTimer:0,

    aggression:
      0.7+
      level*0.08+
      Math.random()*0.25,

    turnSpeed:
      0.035+
      Math.random()*0.025,

    avoidPower:1,

    flankSide:Math.random()<.5?-1:1,

    personality:Math.random(),

    boostTimer:0
  };

  let length=
    30+
    Math.floor(enemyScore/15);

  length=Math.min(length,100);

  for(let j=0;j<length;j++){

    enemy.body.push({
      x:x-j*8,
      y:y
    });

  }

  return enemy;
}


// =========================
// LEVEL
// =========================

function playerLevel(){

  return Math.min(
    10,
    Math.floor(player.score/100)+1
  );

}


// =========================
// FOOD
// =========================

function spawnFood(){

  foods.push({

    x:100+Math.random()*(WORLD-200),

    y:100+Math.random()*(WORLD-200),

    value:
      5+
      Math.floor(Math.random()*10),

    size:7+Math.random()*3

  });

}


// =========================
// COINS
// =========================

function spawnCoin(){

  coins.push({

    x:100+Math.random()*(WORLD-200),

    y:100+Math.random()*(WORLD-200),

    value:1+Math.floor(Math.random()*3),

    size:7

  });

}


// =========================
// DISTANCE
// =========================

function dist(ax,ay,bx,by){

  return Math.hypot(ax-bx,ay-by);

}


// =========================
// ANGLE
// =========================

function angleDiff(a,b){

  return Math.atan2(
    Math.sin(b-a),
    Math.cos(b-a)
  );

}


// =========================
// COLLISION POINT
// =========================

function pointSegmentDistance(
  px,py,
  ax,ay,
  bx,by
){

  let dx=bx-ax;
  let dy=by-ay;

  if(dx===0 && dy===0){

    return Math.hypot(px-ax,py-ay);

  }

  let t=
    ((px-ax)*dx+
     (py-ay)*dy)/
    (dx*dx+dy*dy);

  t=Math.max(0,Math.min(1,t));

  let cx=ax+t*dx;
  let cy=ay+t*dy;

  return Math.hypot(px-cx,py-cy);
}


// =========================
// PLAYER BODY COLLISION
// =========================

function hitPlayerBody(x,y,r=0){

  // bagian kepala dilewati
  for(let i=8;i<player.body.length;i++){

    let p=player.body[i];

    if(
      dist(x,y,p.x,p.y)
      <
      player.radius+r+6
    ){

      return true;
    }
  }

  return false;
}


// =========================
// ENEMY BODY COLLISION
// =========================

function hitEnemyBody(enemy,x,y,r=0){

  // kepala + beberapa bagian awal tidak dihitung
  for(let i=7;i<enemy.body.length;i++){

    let p=enemy.body[i];

    if(
      dist(x,y,p.x,p.y)
      <
      enemy.radius+r+6
    ){

      return true;
    }
  }

  return false;
}


// =========================
// SMART AI
// =========================

function updateEnemy(enemy){

  let level=playerLevel();

  enemy.thinkTimer--;

  /*
    AI berpikir ulang setiap beberapa frame.
    Semakin tinggi level, semakin cepat berpikir.
  */

  if(enemy.thinkTimer<=0){

    enemy.thinkTimer=
      Math.max(5,18-level);

    let dx=player.x-enemy.x;
    let dy=player.y-enemy.y;

    let distanceToPlayer=Math.hypot(dx,dy);

    /*
      ============================
      1. DETEKSI BADAN PLAYER
      ============================
    */

    let nearestBody=null;
    let nearestDist=Infinity;

    for(
      let i=8;
      i<player.body.length;
      i+=2
    ){

      let p=player.body[i];

      let d=dist(
        enemy.x,
        enemy.y,
        p.x,
        p.y
      );

      if(d<nearestDist){

        nearestDist=d;
        nearestBody=p;

      }

    }


    /*
      ============================
      2. PREDIKSI GERAK PLAYER
      ============================
    */

    let prediction=
      70+
      level*12;

    let predictedX=
      player.x+
      Math.cos(player.angle)*
      prediction;

    let predictedY=
      player.y+
      Math.sin(player.angle)*
      prediction;


    /*
      ============================
      3. CEK APAKAH JALUR AMAN
      ============================
    */

    let danger=false;

    let futureX=
      enemy.x+
      Math.cos(enemy.angle)*120;

    let futureY=
      enemy.y+
      Math.sin(enemy.angle)*120;

    if(
      hitPlayerBody(
        futureX,
        futureY,
        enemy.radius
      )
    ){

      danger=true;

    }


    /*
      ============================
      4. HINDARI BADAN PLAYER
      ============================
    */

    if(danger){

      // belok menjauh dari badan
      let awayAngle=
        Math.atan2(
          enemy.y-player.y,
          enemy.x-player.x
        );

      // geser ke samping
      let sideAngle=
        awayAngle+
        enemy.flankSide*Math.PI/2;

      enemy.targetX=
        enemy.x+
        Math.cos(sideAngle)*350;

      enemy.targetY=
        enemy.y+
        Math.sin(sideAngle)*350;

    }


    /*
      ============================
      5. JIKA LEBIH LEMAH
      ============================
    */

    else if(enemy.score<player.score){

      /*
        Jangan tabrak kepala player.
        Cari badan bagian samping/belakang.
      */

      let sideDistance=
        150+
        level*15;

      let sideAngle=
        player.angle+
        enemy.flankSide*Math.PI/2;

      enemy.targetX=
        player.x+
        Math.cos(sideAngle)*sideDistance;

      enemy.targetY=
        player.y+
        Math.sin(sideAngle)*sideDistance;

    }


    /*
      ============================
      6. JIKA LEBIH KUAT
      ============================
    */

    else{

      /*
        Musuh kuat mencoba memotong
        jalur player, bukan mengejar
        posisi kepala secara lurus.
      */

      enemy.targetX=predictedX;
      enemy.targetY=predictedY;

      /*
        Jika sudah terlalu dekat dengan kepala,
        geser ke samping agar tidak mati
        head-to-head.
      */

      if(distanceToPlayer<230){

        let sideAngle=
          player.angle+
          enemy.flankSide*Math.PI/2;

        enemy.targetX=
          player.x+
          Math.cos(sideAngle)*130;

        enemy.targetY=
          player.y+
          Math.sin(sideAngle)*130;

      }

    }


    /*
      ============================
      7. CARI MAKANAN
      ============================
    */

    if(
      distanceToPlayer>
      900+
      level*100
    ){

      let nearestFood=null;
      let fd=Infinity;

      for(let f of foods){

        let d=
          dist(enemy.x,enemy.y,f.x,f.y);

        if(d<fd){

          fd=d;
          nearestFood=f;

        }

      }

      if(nearestFood){

        enemy.targetX=nearestFood.x;
        enemy.targetY=nearestFood.y;

      }

    }

    /*
      ============================
      8. JANGAN TABRAK BADAN SENDIRI
      ============================
    */

    let selfDanger=false;

    for(
      let i=10;
      i<enemy.body.length;
      i+=3
    ){

      let p=enemy.body[i];

      if(
        dist(
          futureX,
          futureY,
          p.x,
          p.y
        )<
        enemy.radius*2.5
      ){

        selfDanger=true;
        break;

      }

    }

    if(selfDanger){

      let escapeAngle=
        enemy.angle+
        enemy.flankSide*1.3;

      enemy.targetX=
        enemy.x+
        Math.cos(escapeAngle)*250;

      enemy.targetY=
        enemy.y+
        Math.sin(escapeAngle)*250;

    }

  }


  /*
    ============================
    MOVEMENT
    ============================
  */

  let targetAngle=
    Math.atan2(
      enemy.targetY-enemy.y,
      enemy.targetX-enemy.x
    );

  let diff=
    angleDiff(
      enemy.angle,
      targetAngle
    );

  /*
    Musuh lebih responsif di level tinggi.
  */

  let turn=
    enemy.turnSpeed+
    level*.0025;

  if(diff>turn)
    enemy.angle+=turn;

  else if(diff<-turn)
    enemy.angle-=turn;

  else
    enemy.angle=targetAngle;


  /*
    ============================
    SPEED HARD
    ============================
  */

  let speed=
    2.3+
    level*.17+
    enemy.aggression*.25;

  /*
    Boost sesekali ketika mengejar.
  */

  let dPlayer=
    dist(
      enemy.x,
      enemy.y,
      player.x,
      player.y
    );

  if(
    dPlayer<650 &&
    enemy.score>=player.score
  ){

    speed*=1.18;

  }


  enemy.x+=
    Math.cos(enemy.angle)*speed;

  enemy.y+=
    Math.sin(enemy.angle)*speed;


  /*
    Batas dunia
  */

  if(enemy.x<100){

    enemy.x=100;
    enemy.angle=0;

  }

  if(enemy.x>WORLD-100){

    enemy.x=WORLD-100;
    enemy.angle=Math.PI;

  }

  if(enemy.y<100){

    enemy.y=100;
    enemy.angle=Math.PI/2;

  }

  if(enemy.y>WORLD-100){

    enemy.y=WORLD-100;
    enemy.angle=-Math.PI/2;

  }


  /*
    Update badan
  */

  enemy.body[0].x=enemy.x;
  enemy.body[0].y=enemy.y;

  for(let i=1;i<enemy.body.length;i++){

    let prev=enemy.body[i-1];
    let cur=enemy.body[i];

    let dx=prev.x-cur.x;
    let dy=prev.y-cur.y;

    let d=Math.hypot(dx,dy);

    if(d>8){

      cur.x+=dx/d*(d-8);
      cur.y+=dy/d*(d-8);

    }

  }

}


// =========================
// PLAYER UPDATE
// =========================

function updatePlayer(){

  let dx=0;
  let dy=0;

  if(keys["w"]||keys["arrowup"])
    dy-=1;

  if(keys["s"]||keys["arrowdown"])
    dy+=1;

  if(keys["a"]||keys["arrowleft"])
    dx-=1;

  if(keys["d"]||keys["arrowright"])
    dx+=1;


  if(
    Math.abs(joystickX)>.1 ||
    Math.abs(joystickY)>.1
  ){

    dx=joystickX;
    dy=joystickY;

  }


  if(dx!==0 || dy!==0){

    let d=Math.hypot(dx,dy);

    dx/=d;
    dy/=d;

    player.angle=
      Math.atan2(dy,dx);

  }


  let speed=
    player.speed;

  if(speedTime>0)
    speed*=2;

  if(boost)
    speed*=1.65;


  player.x+=
    Math.cos(player.angle)*speed;

  player.y+=
    Math.sin(player.angle)*speed;


  /*
    WORLD BORDER
  */

  player.x=
    Math.max(
      100,
      Math.min(WORLD-100,player.x)
    );

  player.y=
    Math.max(
      100,
      Math.min(WORLD-100,player.y)
    );


  /*
    BODY
  */

  player.body[0].x=player.x;
  player.body[0].y=player.y;

  for(let i=1;i<player.body.length;i++){

    let prev=player.body[i-1];
    let cur=player.body[i];

    let dx=prev.x-cur.x;
    let dy=prev.y-cur.y;

    let d=Math.hypot(dx,dy);

    if(d>8){

      cur.x+=dx/d*(d-8);
      cur.y+=dy/d*(d-8);

    }

  }

}


// =========================
// SUCTION
// =========================

function suctionRange(){

  if(magnetTime>0)
    return 280;

  return player.radius*1.5;

}


function suckItems(){

  let range=suctionRange();

  for(let f of foods){

    let d=
      dist(
        player.x,
        player.y,
        f.x,
        f.y
      );

    if(d<range){

      let force=
        magnetTime>0
        ? .12
        : .05;

      f.x+=
        (player.x-f.x)*force;

      f.y+=
        (player.y-f.y)*force;

    }

  }

  for(let c of coins){

    let d=
      dist(
        player.x,
        player.y,
        c.x,
        c.y
      );

    if(d<range){

      c.x+=
        (player.x-c.x)*.14;

      c.y+=
        (player.y-c.y)*.14;

    }

  }

}


// =========================
// EAT FOOD
// =========================

function eatFood(){

  for(let i=foods.length-1;i>=0;i--){

    let f=foods[i];

    if(
      dist(
        player.x,
        player.y,
        f.x,
        f.y
      )<
      player.radius+f.size+5
    ){

      let value=f.value;

      if(bonusTime>0)
        value*=5;

      player.score+=value;

      /*
        Tambah badan
      */

      for(let j=0;j<Math.max(1,Math.floor(value/5));j++){

        let last=
          player.body[player.body.length-1];

        player.body.push({
          x:last.x,
          y:last.y
        });

      }

      foods.splice(i,1);

    }

  }


  for(let i=coins.length-1;i>=0;i--){

    let c=coins[i];

    if(
      dist(
        player.x,
        player.y,
        c.x,
        c.y
      )<
      player.radius+c.size+6
    ){

      let value=c.value;

      if(bonusTime>0)
        value*=5;

      wallet+=value;

      localStorage.setItem(
        "dragonCoins",
        wallet
      );

      coins.splice(i,1);

    }

  }

}


// =========================
// COLLISION SYSTEM
// =========================

function checkCollisions(){

  /*
    =================================================
    PRIORITAS #1
    KEPALA MUSUH MENABRAK BADAN PLAYER
    =================================================

    Musuh mati.
    Player mendapatkan score.

    Ini sengaja diperiksa PALING AWAL supaya
    musuh yang mencoba menyerang badan player
    tidak tiba-tiba kalah head-to-head.
  */

  for(let i=enemies.length-1;i>=0;i--){

    let e=enemies[i];

    if(
      hitPlayerBody(
        e.x,
        e.y,
        e.radius
      )
    ){

      let reward=
        Math.floor(e.score*.15)+50;

      player.score+=reward;

      createExplosion(
        e.x,
        e.y,
        e.color
      );

      /*
        Musuh tidak langsung hilang begitu saja.
        Pecah menjadi makanan.
      */

      for(let k=0;k<10;k++){

        foods.push({

          x:e.x+(Math.random()-.5)*120,

          y:e.y+(Math.random()-.5)*120,

          value:8+Math.floor(Math.random()*12),

          size:8

        });

      }

      enemies.splice(i,1);

      continue;

    }


    /*
      =================================================
      PRIORITAS #2
      KEPALA PLAYER MENABRAK BADAN MUSUH
      =================================================
    */

    if(
      hitEnemyBody(
        e,
        player.x,
        player.y,
        player.radius
      )
    ){

      gameOver();

      return;

    }


    /*
      =================================================
      PRIORITAS #3
      HEAD TO HEAD
      =================================================
    */

    let d=
      dist(
        player.x,
        player.y,
        e.x,
        e.y
      );

    if(
      d<
      player.radius+
      e.radius+
      5
    ){

      if(player.score>e.score){

        player.score+=
          Math.floor(e.score*.1);

        createExplosion(
          e.x,
          e.y,
          e.color
        );

        enemies.splice(i,1);

      }
      else{

        gameOver();

        return;

      }

    }

  }

}


// =========================
// EXPLOSION
// =========================

function createExplosion(x,y,color){

  for(let i=0;i<20;i++){

    particles.push({

      x:x,
      y:y,

      vx:(Math.random()-.5)*5,
      vy:(Math.random()-.5)*5,

      life:30+Math.random()*30,

      color:color

    });

  }

}


// =========================
// PARTICLES
// =========================

function updateParticles(){

  for(let i=particles.length-1;i>=0;i--){

    let p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.life--;

    if(p.life<=0)
      particles.splice(i,1);

  }

}


// =========================
// DRAW SNAKE
// =========================

function drawSnake(snake,isPlayer=false){

  /*
    Body
  */

  for(
    let i=snake.body.length-1;
    i>=0;
    i--
  ){

    let p=snake.body[i];

    ctx.beginPath();

    let r=
      snake.radius-
      Math.min(
        3,
        i*.015
      );

    ctx.arc(
      p.x,
      p.y,
      Math.max(8,r),
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      isPlayer
      ? (
        i%2===0
        ? "#00e5ff"
        : "#008cff"
      )
      : snake.color;

    ctx.fill();

  }


  /*
    HEAD
  */

  ctx.beginPath();

  ctx.arc(
    snake.x,
    snake.y,
    snake.radius+2,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    isPlayer
    ? "#00ffff"
    : snake.color;

  ctx.fill();


  /*
    Eyes
  */

  let ex=
    Math.cos(snake.angle);

  let ey=
    Math.sin(snake.angle);

  let px=-ey;
  let py=ex;

  for(let side of [-1,1]){

    ctx.beginPath();

    ctx.arc(
      snake.x+
      ex*8+
      px*side*6,

      snake.y+
      ey*8+
      py*side*6,

      3.5,

      0,
      Math.PI*2
    );

    ctx.fillStyle="white";
    ctx.fill();

    ctx.beginPath();

    ctx.arc(
      snake.x+
      ex*9+
      px*side*6,

      snake.y+
      ey*9+
      py*side*6,

      1.7,

      0,
      Math.PI*2
    );

    ctx.fillStyle="black";
    ctx.fill();

  }

}


// =========================
// DRAW WORLD
// =========================

function drawWorld(){

  ctx.clearRect(0,0,W,H);

  let zoom=
    zoomTime>0
    ? .72
    : 1;

  ctx.save();

  ctx.translate(W/2,H/2);

  ctx.scale(zoom,zoom);

  ctx.translate(
    -player.x,
    -player.y
  );


  /*
    Background
  */

  ctx.fillStyle="#101010";

  ctx.fillRect(
    0,
    0,
    WORLD,
    WORLD
  );


  /*
    Grid
  */

  ctx.strokeStyle=
    "rgba(255,255,255,.035)";

  ctx.lineWidth=1;

  for(
    let x=0;
    x<=WORLD;
    x+=100
  ){

    ctx.beginPath();

    ctx.moveTo(x,0);
    ctx.lineTo(x,WORLD);

    ctx.stroke();

  }

  for(
    let y=0;
    y<=WORLD;
    y+=100
  ){

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(WORLD,y);

    ctx.stroke();

  }


  /*
    Food
  */

  for(let f of foods){

    ctx.font=
      `${f.size*2.2}px Arial`;

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
      "🍰",
      f.x,
      f.y
    );

  }


  /*
    Coins
  */

  for(let c of coins){

    ctx.beginPath();

    ctx.arc(
      c.x,
      c.y,
      c.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#ffd700";
    ctx.fill();

    ctx.strokeStyle="#fff2a0";
    ctx.stroke();

    ctx.fillStyle="#8b6500";

    ctx.font="8px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
      "★",
      c.x,
      c.y
    );

  }


  /*
    Enemies
  */

  for(let e of enemies){

    drawSnake(e,false);

    /*
      Enemy name + score
    */

    ctx.font="bold 11px Arial";

    ctx.textAlign="center";

    ctx.fillStyle="white";

    ctx.fillText(
      "HARD • "+Math.floor(e.score),
      e.x,
      e.y-e.radius-10
    );

  }


  /*
    Player
  */

  drawSnake(player,true);


  /*
    Particles
  */

  for(let p of particles){

    ctx.globalAlpha=
      Math.max(0,p.life/50);

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      3,
      0,
      Math.PI*2
    );

    ctx.fillStyle=p.color;

    ctx.fill();

  }

  ctx.globalAlpha=1;

  ctx.restore();

}


// =========================
// POWER TIMER
// =========================

function updatePowers(){

  if(magnetTime>0)
    magnetTime--;

  if(zoomTime>0)
    zoomTime--;

  if(bonusTime>0)
    bonusTime--;

  if(speedTime>0)
    speedTime--;


  updatePowerUI();

}


function updatePowerUI(){

  setPower(
    "magnetUI",
    magnetTime
  );

  setPower(
    "zoomUI",
    zoomTime
  );

  setPower(
    "bonusUI",
    bonusTime
  );

  setPower(
    "speedUI",
    speedTime
  );

}


function setPower(id,time){

  let el=
    document.getElementById(id);

  if(time>0){

    el.style.display="block";

    let sec=
      Math.ceil(time/60);

    el.querySelector("span").textContent=
      sec+"s";

  }
  else{

    el.style.display="none";

  }

}


// =========================
// SPAWN MANAGEMENT
// =========================

function maintainWorld(){

  while(foods.length<100)
    spawnFood();

  while(coins.length<35)
    spawnCoin();


  /*
    Jumlah musuh meningkat berdasarkan level
  */

  let level=playerLevel();

  let targetEnemies=
    Math.min(
      10,
      4+
      Math.floor(level/2)
    );

  while(enemies.length<targetEnemies){

    enemies.push(
      createEnemy(
        enemies.length
      )
    );

  }

}


// =========================
// UI
// =========================

function updateUI(){

  document.getElementById(
    "playerName"
  ).textContent=player.name;

  document.getElementById(
    "scoreText"
  ).textContent=
    Math.floor(player.score);

  document.getElementById(
    "levelText"
  ).textContent=
    playerLevel();

  document.getElementById(
    "coinText"
  ).textContent=
    wallet;

}


// =========================
// GAME LOOP
// =========================

function loop(){

  if(!running)
    return;

  gameTime++;

  updatePlayer();

  for(let e of enemies)
    updateEnemy(e);

  suckItems();

  eatFood();

  checkCollisions();

  updateParticles();

  updatePowers();

  maintainWorld();

  updateUI();

  drawWorld();

  requestAnimationFrame(loop);

}


// =========================
// START
// =========================

function startGame(){

  document.getElementById(
    "menu"
  ).style.display="none";

  document.getElementById(
    "game"
  ).style.display="block";

  running=true;

  gameTime=0;

  magnetTime=0;
  zoomTime=0;
  bonusTime=0;
  speedTime=0;

  foods=[];
  coins=[];
  enemies=[];
  particles=[];

  createPlayer();

  for(let i=0;i<6;i++)
    enemies.push(createEnemy(i));

  for(let i=0;i<120;i++)
    spawnFood();

  for(let i=0;i<40;i++)
    spawnCoin();

  updateUI();

  loop();

}


// =========================
// GAME OVER
// =========================

function gameOver(){

  if(!running)
    return;

  running=false;

  document.getElementById(
    "finalText"
  ).innerHTML=
    `
    <b>${player.name}</b><br>
    Score: <b>${Math.floor(player.score)}</b><br>
    Level: <b>${playerLevel()}</b>
    `;


  createLeaderboard();

  document.getElementById(
    "gameOver"
  ).style.display="flex";

}


function createLeaderboard(){

  let list=[
    {
      name:player.name,
      score:Math.floor(player.score)
    }
  ];

  for(let e of enemies){

    list.push({
      name:"🐍 HARD AI",
      score:Math.floor(e.score)
    });

  }

  list.sort(
    (a,b)=>b.score-a.score
  );

  list=list.slice(0,5);

  let html="<b>🏆 SCOREBOARD</b><br><br>";

  list.forEach((x,i)=>{

    html+=
      `${i+1}. ${x.name} — ${x.score}<br>`;

  });

  document.getElementById(
    "leaderboard"
  ).innerHTML=html;

}


// =========================
// RESTART
// =========================

function restartGame(){

  document.getElementById(
    "gameOver"
  ).style.display="none";

  startGame();

}


// =========================
// BACK MENU
// =========================

function backMenu(){

  running=false;

  document.getElementById(
    "gameOver"
  ).style.display="none";

  document.getElementById(
    "game"
  ).style.display="none";

  document.getElementById(
    "menu"
  ).style.display="flex";

}


// =========================
// SHOP
// =========================

function openShop(){

  document.getElementById(
    "shopCoins"
  ).textContent=wallet;

  document.getElementById(
    "shop"
  ).style.display="flex";

}


function closeShop(){

  document.getElementById(
    "shop"
  ).style.display="none";

}


function buyPower(type,cost){

  if(wallet<cost){

    alert("Koin kamu belum cukup!");

    return;

  }

  wallet-=cost;

  localStorage.setItem(
    "dragonCoins",
    wallet
  );


  /*
    20 detik
  */

  let duration=
    20*60;

  if(type==="magnet")
    magnetTime=duration;

  if(type==="zoom")
    zoomTime=duration;

  if(type==="bonus")
    bonusTime=duration;

  if(type==="speed")
    speedTime=duration;


  document.getElementById(
    "shopCoins"
  ).textContent=wallet;

  updateUI();

}


// =========================
// JOYSTICK
// =========================

const joystick=
  document.getElementById("joystick");

const stick=
  document.getElementById("stick");

let joyActive=false;

function updateJoystick(e){

  let rect=
    joystick.getBoundingClientRect();

  let cx=
    rect.left+
    rect.width/2;

  let cy=
    rect.top+
    rect.height/2;

  let x=e.clientX-cx;
  let y=e.clientY-cy;

  let max=
    rect.width/2-27;

  let d=Math.hypot(x,y);

  if(d>max){

    x=x/d*max;
    y=y/d*max;

  }

  joystickX=x/max;
  joystickY=y/max;

  stick.style.left=
    `calc(50% + ${x}px)`;

  stick.style.top=
    `calc(50% + ${y}px)`;

}


joystick.addEventListener(
  "pointerdown",
  e=>{

    joyActive=true;

    joystick.setPointerCapture(
      e.pointerId
    );

    updateJoystick(e);

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(joyActive)
      updateJoystick(e);

  }
);


joystick.addEventListener(
  "pointerup",
  resetJoystick
);


joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


function resetJoystick(){

  joyActive=false;

  joystickX=0;
  joystickY=0;

  stick.style.left="50%";
  stick.style.top="50%";

}


// =========================
// BOOST BUTTON
// =========================

const boostBtn=
  document.getElementById("boostBtn");

boostBtn.addEventListener(
  "pointerdown",
  e=>{

    boost=true;

    e.preventDefault();

  }
);

boostBtn.addEventListener(
  "pointerup",
  e=>{

    boost=false;

    e.preventDefault();

  }
);

boostBtn.addEventListener(
  "pointercancel",
  ()=>{
    boost=false;
  }
);

boostBtn.addEventListener(
  "pointerleave",
  ()=>{
    boost=false;
  }
);


// =========================
// MOUSE CONTROL PC
// =========================

let mouseControl=false;

canvas.addEventListener(
  "mousemove",
  e=>{

    if(!running)
      return;

    /*
      Mouse PC:
      ular mengarah ke posisi mouse
    */

    let dx=
      e.clientX-W/2;

    let dy=
      e.clientY-H/2;

    if(
      Math.abs(dx)>15 ||
      Math.abs(dy)>15
    ){

      player.angle=
        Math.atan2(dy,dx);

    }

  }
);


// =========================
// INIT
// =========================

updateUI();

</script>
