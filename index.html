<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Dragon Snake Battle</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#07111d;
  color:white;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

#menu{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% 35%,#244e72 0,#102638 35%,#050b12 100%);
}

.menuBox{
  width:min(430px,100%);
  padding:28px 22px;
  border-radius:28px;
  background:rgba(8,18,29,.92);
  border:2px solid rgba(255,255,255,.15);
  box-shadow:0 20px 60px #000;
  text-align:center;
}

.logo{
  font-size:42px;
  font-weight:900;
  margin-bottom:4px;
  text-shadow:0 4px 15px #000;
}

.logo span{
  color:#ffd43b;
}

.sub{
  color:#a9bac9;
  margin-bottom:22px;
}

input{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  margin-bottom:12px;
  font-size:17px;
  outline:none;
}

.startBtn{
  width:100%;
  padding:16px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,#00e676,#00a85a);
  color:#002b18;
  font-size:19px;
  font-weight:900;
  cursor:pointer;
}

.info{
  margin-top:18px;
  color:#91a4b5;
  font-size:13px;
  line-height:1.5;
}

#gameUI{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
}

.top{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.stat{
  background:rgba(4,13,22,.78);
  border:1px solid rgba(255,255,255,.15);
  border-radius:14px;
  padding:8px 12px;
  backdrop-filter:blur(8px);
  box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.stat b{
  color:#ffd43b;
}

.rank{
  min-width:150px;
  max-width:190px;
  background:rgba(4,13,22,.78);
  border-radius:15px;
  padding:10px;
  font-size:12px;
}

.rankTitle{
  font-size:14px;
  font-weight:bold;
  color:#ffd43b;
  margin-bottom:5px;
}

.rankRow{
  display:flex;
  justify-content:space-between;
  margin:3px 0;
  color:#d8e2ea;
}

#message{
  position:absolute;
  top:42%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  font-size:30px;
  font-weight:900;
  text-shadow:0 4px 15px #000;
  opacity:0;
  transition:.3s;
  white-space:nowrap;
}

#message.show{
  opacity:1;
}

#boostBtn{
  position:absolute;
  right:20px;
  bottom:25px;
  width:82px;
  height:82px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,.7);
  background:linear-gradient(#ffca28,#ff6d00);
  color:white;
  font-size:13px;
  font-weight:900;
  box-shadow:0 7px 25px rgba(255,110,0,.5);
  pointer-events:auto;
  touch-action:none;
}

#boostBtn:active{
  transform:scale(.93);
}

#joystick{
  position:absolute;
  left:22px;
  bottom:25px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.18);
  pointer-events:auto;
  touch-action:none;
}

#stick{
  position:absolute;
  left:50%;
  top:50%;
  width:54px;
  height:54px;
  margin-left:-27px;
  margin-top:-27px;
  border-radius:50%;
  background:rgba(255,255,255,.35);
  border:2px solid rgba(255,255,255,.5);
}

#gameOver{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.72);
}

.overBox{
  width:min(390px,100%);
  text-align:center;
  background:#0d1c2b;
  border:2px solid rgba(255,255,255,.15);
  border-radius:25px;
  padding:28px;
  box-shadow:0 20px 60px #000;
}

.overTitle{
  font-size:38px;
  font-weight:900;
}

.finalScore{
  font-size:24px;
  margin:15px 0;
  color:#ffd43b;
}

.again{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  background:#00e676;
  font-size:18px;
  font-weight:bold;
}

@media(max-width:600px){
  .logo{font-size:35px}
  .rank{min-width:125px;font-size:11px}
  .stat{font-size:13px}
  #message{font-size:25px}
}

@media(min-width:700px){
  #joystick{
    display:none;
  }

  #boostBtn{
    bottom:30px;
    right:30px;
  }
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<!-- MENU -->
<div id="menu">

  <div class="menuBox">

    <div class="logo">
      🐉 DRAGON <span>SNAKE</span>
    </div>

    <div class="sub">
      ⚔️ Battle Arena • Snake.io Style
    </div>

    <input id="playerName"
           maxlength="15"
           placeholder="Nama pemain"
           value="Dimas">

    <button class="startBtn" onclick="startGame()">
      🚀 MULAI BATTLE
    </button>

    <div class="info">
      🍎 Makan untuk bertambah besar<br>
      ⚔️ Adu kepala berdasarkan poin<br>
      🏆 Kalahkan ular lain dan jadi nomor 1!<br>
      📱 HP: gunakan joystick • PC: arahkan mouse
    </div>

  </div>

</div>


<!-- UI -->
<div id="gameUI">

  <div class="top">

    <div class="stat">
      🐉 <span id="nameUI">Dimas</span><br>
      ⭐ <b id="scoreUI">100</b> Poin<br>
      📏 <b id="lengthUI">10</b> Panjang<br>
      🏆 Lv <b id="levelUI">1</b>
    </div>

    <div class="rank">

      <div class="rankTitle">
        🏆 LEADERBOARD
      </div>

      <div id="leaderboard"></div>

    </div>

  </div>

  <div id="message"></div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="boostBtn">
    ⚡<br>BOOST
  </button>

</div>


<!-- GAME OVER -->
<div id="gameOver">

  <div class="overBox">

    <div class="overTitle">
      💀 KALAH!
    </div>

    <div id="overText">
      Permainan selesai
    </div>

    <div class="finalScore">
      ⭐ <span id="finalScore">0</span> Poin
    </div>

    <button class="again" onclick="restartGame()">
      🔄 MAIN LAGI
    </button>

  </div>

</div>


<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;

  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  ctx.setTransform(
    devicePixelRatio,0,0,devicePixelRatio,0,0
  );

  W = window.innerWidth;
  H = window.innerHeight;
}

resize();

window.addEventListener("resize",resize);


/* =========================
   GAME VARIABLES
========================= */

let player;
let enemies = [];
let foods = [];
let coins = [];

let running = false;
let level = 1;
let kills = 0;

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

let joystickActive = false;

let boost = false;

let worldSize = 2600;


/* =========================
   COLORS
========================= */

const enemyColors = [
  "#ff4d6d",
  "#38bdf8",
  "#a78bfa",
  "#facc15",
  "#fb923c",
  "#4ade80",
  "#f472b6"
];


/* =========================
   RANDOM
========================= */

function random(min,max){
  return Math.random() * (max-min) + min;
}

function distance(a,b){
  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}


/* =========================
   PLAYER
========================= */

function createPlayer(){

  return {
    x:0,
    y:0,

    angle:0,

    speed:2.5,

    radius:16,

    score:100,

    body:[],

    color:"#22c55e",

    name:
      document.getElementById("playerName")
      .value.trim() || "Dimas",

    boost:false
  };
}


/* =========================
   ENEMY
========================= */

function createEnemy(index){

  let angle = random(0,Math.PI*2);

  let distanceFromCenter =
    random(250,worldSize/2);

  let x =
    Math.cos(angle) * distanceFromCenter;

  let y =
    Math.sin(angle) * distanceFromCenter;

  let score =
    random(50,260) + level*15;

  let enemy = {

    id:index,

    x:x,

    y:y,

    angle:random(0,Math.PI*2),

    targetAngle:random(0,Math.PI*2),

    speed:random(1.4,2.1),

    radius:14,

    score:Math.floor(score),

    color:
      enemyColors[
        Math.floor(
          Math.random()*enemyColors.length
        )
      ],

    name:
      [
        "Draco",
        "Shadow",
        "Blaze",
        "Titan",
        "Storm",
        "Venom",
        "DragonX",
        "King",
        "Hunter",
        "Inferno"
      ][
        Math.floor(Math.random()*10)
      ],

    body:[],

    changeTimer:0
  };

  for(let i=0;i<10+Math.floor(score/25);i++){

    enemy.body.push({
      x:x,
      y:y
    });

  }

  return enemy;
}


/* =========================
   FOOD
========================= */

function createFood(){

  return {
    x:random(-worldSize,worldSize),
    y:random(-worldSize,worldSize),

    value:
      Math.random()<.12 ? 20 : 5,

    size:
      Math.random()<.12 ? 9 : 6,

    color:
      Math.random()<.12
      ? "#ffd43b"
      : "#ff6b6b"
  };
}


/* =========================
   COINS
========================= */

function createCoin(){

  return {
    x:random(-worldSize,worldSize),
    y:random(-worldSize,worldSize),
    value:10
  };
}


/* =========================
   START
========================= */

function startGame(){

  document.getElementById("menu")
    .style.display="none";

  document.getElementById("gameOver")
    .style.display="none";

  level=1;
  kills=0;

  worldSize=2600;

  player=createPlayer();

  enemies=[];
  foods=[];
  coins=[];

  for(let i=0;i<6;i++){
    enemies.push(createEnemy(i));
  }

  for(let i=0;i<140;i++){
    foods.push(createFood());
  }

  for(let i=0;i<30;i++){
    coins.push(createCoin());
  }

  player.body=[];

  for(let i=0;i<12;i++){

    player.body.push({
      x:player.x,
      y:player.y
    });

  }

  running=true;

  showMessage(
    "🔥 BATTLE DIMULAI!",
    1200
  );

  requestAnimationFrame(gameLoop);
}


/* =========================
   MOUSE
========================= */

canvas.addEventListener("mousemove",e=>{

  mouseX=e.clientX;
  mouseY=e.clientY;

});


canvas.addEventListener("touchmove",e=>{

  if(e.touches.length){

    mouseX=e.touches[0].clientX;
    mouseY=e.touches[0].clientY;

  }

},{passive:true});


/* =========================
   JOYSTICK
========================= */

const joystick =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");

function joystickMove(e){

  let rect =
    joystick.getBoundingClientRect();

  let cx =
    rect.left + rect.width/2;

  let cy =
    rect.top + rect.height/2;

  let x =
    e.clientX-cx;

  let y =
    e.clientY-cy;

  let max =
    rect.width/2-27;

  let len =
    Math.hypot(x,y);

  if(len>max){

    x=x/len*max;
    y=y/len*max;

  }

  stick.style.transform =
    `translate(${x}px,${y}px)`;

  if(Math.hypot(x,y)>10){

    player.angle =
      Math.atan2(y,x);

    joystickActive=true;

  }

}

joystick.addEventListener(
  "pointermove",
  joystickMove
);

joystick.addEventListener(
  "pointerdown",
  e=>{
    joystick.setPointerCapture(e.pointerId);
    joystickMove(e);
  }
);

joystick.addEventListener(
  "pointerup",
  ()=>{
    joystickActive=false;

    stick.style.transform =
      "translate(0,0)";
  }
);


/* =========================
   BOOST
========================= */

const boostBtn =
  document.getElementById("boostBtn");

boostBtn.addEventListener(
  "pointerdown",
  ()=>{
    boost=true;
  }
);

boostBtn.addEventListener(
  "pointerup",
  ()=>{
    boost=false;
  }
);

boostBtn.addEventListener(
  "pointercancel",
  ()=>{
    boost=false;
  }
);


/* =========================
   PLAYER UPDATE
========================= */

function updatePlayer(){

  if(!joystickActive){

    let dx =
      mouseX-W/2;

    let dy =
      mouseY-H/2;

    if(Math.hypot(dx,dy)>20){

      player.angle =
        Math.atan2(dy,dx);

    }

  }

  let speed =
    boost ? 4.4 : 2.5;

  player.x +=
    Math.cos(player.angle)*speed;

  player.y +=
    Math.sin(player.angle)*speed;


  /* WORLD BORDER */

  if(player.x>worldSize)
    player.x=-worldSize;

  if(player.x<-worldSize)
    player.x=worldSize;

  if(player.y>worldSize)
    player.y=-worldSize;

  if(player.y<-worldSize)
    player.y=worldSize;


  /* BODY */

  player.body.unshift({
    x:player.x,
    y:player.y
  });


  let wanted =
    10 + Math.floor(player.score/5);

  while(player.body.length>wanted){
    player.body.pop();
  }

}


/* =========================
   ENEMY AI
========================= */

function updateEnemies(){

  enemies.forEach(enemy=>{

    enemy.changeTimer--;

    if(enemy.changeTimer<=0){

      enemy.changeTimer =
        random(40,130);

      /*
        AI mencari makanan
        atau bergerak random
      */

      let nearestFood=null;

      let nearestDist=Infinity;

      foods.forEach(food=>{

        let d =
          Math.hypot(
            enemy.x-food.x,
            enemy.y-food.y
          );

        if(d<nearestDist){

          nearestDist=d;
          nearestFood=food;

        }

      });

      if(nearestFood && nearestDist<450){

        enemy.targetAngle =
          Math.atan2(
            nearestFood.y-enemy.y,
            nearestFood.x-enemy.x
          );

      }else{

        enemy.targetAngle =
          random(0,Math.PI*2);

      }

    }


    /* Smooth turn */

    let diff =
      enemy.targetAngle-enemy.angle;

    while(diff>Math.PI)
      diff-=Math.PI*2;

    while(diff<-Math.PI)
      diff+=Math.PI*2;

    enemy.angle +=
      diff*.045;


    enemy.x +=
      Math.cos(enemy.angle)*enemy.speed;

    enemy.y +=
      Math.sin(enemy.angle)*enemy.speed;


    if(enemy.x>worldSize)
      enemy.x=-worldSize;

    if(enemy.x<-worldSize)
      enemy.x=worldSize;

    if(enemy.y>worldSize)
      enemy.y=-worldSize;

    if(enemy.y<-worldSize)
      enemy.y=worldSize;


    enemy.body.unshift({
      x:enemy.x,
      y:enemy.y
    });


    let wanted =
      10 + Math.floor(enemy.score/5);

    while(enemy.body.length>wanted)
      enemy.body.pop();

  });

}


/* =========================
   FOOD COLLISION
========================= */

function eatFood(){

  for(let i=foods.length-1;i>=0;i--){

    let food=foods[i];

    if(
      Math.hypot(
        player.x-food.x,
        player.y-food.y
      )
      <
      player.radius+food.size
    ){

      player.score += food.value;

      foods.splice(i,1);

      foods.push(createFood());

      if(food.value>=20){

        showMessage(
          "💎 BIG FOOD +20",
          600
        );

      }

    }

  }


  /* COINS */

  for(let i=coins.length-1;i>=0;i--){

    let coin=coins[i];

    if(
      Math.hypot(
        player.x-coin.x,
        player.y-coin.y
      )
      <
      player.radius+12
    ){

      player.score += coin.value;

      coins.splice(i,1);

      coins.push(createCoin());

      showMessage(
        "🪙 +10 COIN",
        500
      );

    }

  }

}


/* =========================
   PLAYER VS ENEMY
   HEAD VS HEAD
========================= */

function headBattle(){

  for(let i=enemies.length-1;i>=0;i--){

    let enemy=enemies[i];

    let d =
      Math.hypot(
        player.x-enemy.x,
        player.y-enemy.y
      );


    if(d < player.radius+enemy.radius+5){

      /*
        POIN LEBIH BESAR MENANG
      */

      if(player.score>enemy.score){

        let reward =
          Math.floor(enemy.score*.6);

        player.score += reward;

        kills++;

        showMessage(
          "⚔️ MUSUH KALAH! +" +
          reward +
          " POIN",
          1300
        );


        /* Musuh berubah menjadi makanan */

        for(let j=0;j<10;j++){

          foods.push({
            x:
              enemy.x+
              random(-80,80),

            y:
              enemy.y+
              random(-80,80),

            value:
              8,

            size:
              7,

            color:
              "#ffd43b"
          });

        }


        enemies.splice(i,1);

        enemies.push(
          createEnemy(
            Math.random()*1000
          )
        );


      }else if(player.score<enemy.score){

        gameOver(
          enemy.name+
          " lebih besar dari kamu!"
        );

        return;


      }else{

        /*
          POIN SAMA
          KEDUANYA HANCUR
        */

        showMessage(
          "💥 IMBANG! KEDUANYA KALAH!",
          1200
        );

        gameOver(
          "Pertarungan berakhir seri!"
        );

        return;

      }

    }

  }

}


/* =========================
   LEVEL
========================= */

function updateLevel(){

  let newLevel =
    Math.min(
      10,
      1+Math.floor(
        player.score/150
      )
    );


  if(newLevel>level){

    level=newLevel;

    showMessage(
      "🎉 LEVEL " +
      level +
      "!",
      1200
    );


    /*
      Tambah musuh
    */

    if(enemies.length<12){

      enemies.push(
        createEnemy(
          Math.random()*1000
        )
      );

    }

  }

}


/* =========================
   DRAW WORLD
========================= */

function drawWorld(){

  ctx.fillStyle="#071522";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
    CAMERA mengikuti player
  */

  ctx.save();

  ctx.translate(
    W/2-player.x,
    H/2-player.y
  );


  /*
    GRID
  */

  let grid=100;

  ctx.strokeStyle=
    "rgba(255,255,255,.045)";

  ctx.lineWidth=1;

  for(
    let x=-worldSize;
    x<=worldSize;
    x+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(x,-worldSize);

    ctx.lineTo(x,worldSize);

    ctx.stroke();

  }

  for(
    let y=-worldSize;
    y<=worldSize;
    y+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(-worldSize,y);

    ctx.lineTo(worldSize,y);

    ctx.stroke();

  }


  /*
    Arena border
  */

  ctx.strokeStyle=
    "rgba(56,189,248,.25)";

  ctx.lineWidth=8;

  ctx.strokeRect(
    -worldSize,
    -worldSize,
    worldSize*2,
    worldSize*2
  );


  drawFoods();

  drawCoins();

  enemies.forEach(drawSnake);

  drawSnake(player);

  ctx.restore();

}


/* =========================
   DRAW FOOD
========================= */

function drawFoods(){

  foods.forEach(food=>{

    ctx.beginPath();

    ctx.arc(
      food.x,
      food.y,
      food.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle=food.color;

    ctx.shadowBlur=12;

    ctx.shadowColor=food.color;

    ctx.fill();

    ctx.shadowBlur=0;

  });

}


/* =========================
   DRAW COINS
========================= */

function drawCoins(){

  coins.forEach(coin=>{

    ctx.save();

    ctx.translate(
      coin.x,
      coin.y
    );

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      10,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#ffd43b";

    ctx.fill();

    ctx.strokeStyle="#fff";

    ctx.lineWidth=2;

    ctx.stroke();

    ctx.fillStyle="#9b6500";

    ctx.font="bold 11px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
      "$",
      0,
      1
    );

    ctx.restore();

  });

}


/* =========================
   DRAW SNAKE
========================= */

function drawSnake(snake){

  /*
    Body dari belakang
  */

  for(
    let i=snake.body.length-1;
    i>=0;
    i--
  ){

    let part=snake.body[i];

    let ratio=
      i/snake.body.length;

    let r =
      snake.radius*
      (0.65+ratio*.35);


    ctx.beginPath();

    ctx.arc(
      part.x,
      part.y,
      r,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      snake.color;

    ctx.globalAlpha=
      .92;

    ctx.fill();

    ctx.globalAlpha=1;


    /*
      Pattern
    */

    if(i%5===0){

      ctx.beginPath();

      ctx.arc(
        part.x-r*.2,
        part.y-r*.2,
        r*.25,
        0,
        Math.PI*2
      );

      ctx.fillStyle=
        "rgba(255,255,255,.25)";

      ctx.fill();

    }

  }


  /*
    HEAD
  */

  ctx.save();

  ctx.translate(
    snake.x,
    snake.y
  );

  ctx.rotate(
    snake.angle
  );


  /*
    Head
  */

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    snake.radius+2,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    snake.color;

  ctx.fill();


  /*
    Dragon horns
  */

  ctx.fillStyle="#f8fafc";

  ctx.beginPath();

  ctx.moveTo(
    -5,
    -snake.radius
  );

  ctx.lineTo(
    -11,
    -snake.radius-10
  );

  ctx.lineTo(
    1,
    -snake.radius-5
  );

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(
    -5,
    snake.radius
  );

  ctx.lineTo(
    -11,
    snake.radius+10
  );

  ctx.lineTo(
    1,
    snake.radius+5
  );

  ctx.fill();


  /*
    Eyes
  */

  ctx.fillStyle="white";

  ctx.beginPath();

  ctx.arc(
    7,
    -6,
    4,
    0,
    Math.PI*2
  );

  ctx.arc(
    7,
    6,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    8,
    -6,
    2,
    0,
    Math.PI*2
  );

  ctx.arc(
    8,
    6,
    2,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    Mouth
  */

  ctx.strokeStyle=
    "rgba(0,0,0,.55)";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    10,
    0
  );

  ctx.lineTo(
    snake.radius+8,
    0
  );

  ctx.stroke();


  ctx.restore();


  /*
    NAME
  */

  ctx.fillStyle="white";

  ctx.font="bold 12px Arial";

  ctx.textAlign="center";

  ctx.shadowColor="#000";

  ctx.shadowBlur=4;

  ctx.fillText(
    snake.name || "",
    snake.x,
    snake.y-snake.radius-17
  );

  ctx.shadowBlur=0;

}


/* =========================
   LEADERBOARD
========================= */

function updateLeaderboard(){

  let list=[
    {
      name:player.name,
      score:player.score,
      me:true
    }
  ];

  enemies.forEach(e=>{

    list.push({
      name:e.name,
      score:e.score,
      me:false
    });

  });


  list.sort(
    (a,b)=>b.score-a.score
  );


  let html="";

  list.slice(0,5).forEach(
    (p,i)=>{

      html += `
        <div class="rankRow">
          <span>
            ${i+1}. ${p.name}
          </span>
          <b>${Math.floor(p.score)}</b>
        </div>
      `;

    }
  );


  document.getElementById(
    "leaderboard"
  ).innerHTML=html;

}


/* =========================
   UI
========================= */

function updateUI(){

  document.getElementById(
    "nameUI"
  ).innerText=player.name;

  document.getElementById(
    "scoreUI"
  ).innerText=
    Math.floor(player.score);

  document.getElementById(
    "lengthUI"
  ).innerText=
    player.body.length;

  document.getElementById(
    "levelUI"
  ).innerText=level;

  updateLeaderboard();

}


/* =========================
   MESSAGE
========================= */

let messageTimer;

function showMessage(text,time=1000){

  const el=
    document.getElementById("message");

  el.innerText=text;

  el.classList.add("show");

  clearTimeout(messageTimer);

  messageTimer=
    setTimeout(
      ()=>{
        el.classList.remove("show");
      },
      time
    );

}


/* =========================
   GAME OVER
========================= */

function gameOver(reason){

  running=false;

  document.getElementById(
    "finalScore"
  ).innerText=
    Math.floor(player.score);

  document.getElementById(
    "overText"
  ).innerText=reason;

  document.getElementById(
    "gameOver"
  ).style.display="flex";

}


/* =========================
   RESTART
========================= */

function restartGame(){

  document.getElementById(
    "gameOver"
  ).style.display="none";

  startGame();

}


/* =========================
   GAME LOOP
========================= */

let lastTime=0;

function gameLoop(time){

  if(!running)
    return;


  /*
    Jangan terlalu cepat
  */

  if(time-lastTime>10){

    lastTime=time;

    updatePlayer();

    updateEnemies();

    eatFood();

    headBattle();

    updateLevel();

    updateUI();

  }


  drawWorld();


  requestAnimationFrame(gameLoop);

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  e=>{

    if(!running)
      return;


    if(
      e.key==="ArrowUp" ||
      e.key.toLowerCase()==="w"
    ){

      player.angle=-Math.PI/2;

    }

    if(
      e.key==="ArrowDown" ||
      e.key.toLowerCase()==="s"
    ){

      player.angle=Math.PI/2;

    }

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      player.angle=Math.PI;

    }

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      player.angle=0;

    }

    if(e.code==="Space"){

      boost=true;

    }

  }
);

document.addEventListener(
  "keyup",
  e=>{

    if(e.code==="Space"){

      boost=false;

    }

  }
);


/* =========================
   PREVENT SCROLL
========================= */

document.addEventListener(
  "touchmove",
  e=>{
    if(running)
      e.preventDefault();
  },
  {passive:false}
);

</script>
