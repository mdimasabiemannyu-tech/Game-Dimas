<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Dragon Snake Battle</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

body{
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#menu{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#070707,#191919);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:20;
  padding:20px;
}

#menu h1{
  font-size:38px;
  color:#ffd400;
  text-shadow:0 0 20px #ff8c00;
  margin-bottom:10px;
}

#menu p{
  color:#aaa;
  margin-bottom:25px;
}

input{
  width:280px;
  padding:14px;
  border:0;
  border-radius:12px;
  text-align:center;
  font-size:18px;
  margin-bottom:15px;
  outline:none;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 20px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.startBtn{
  background:#ffd400;
  color:#111;
  box-shadow:0 0 20px #ff9d00;
}

#game{
  display:none;
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  background:#101010;
}

#topUI{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  z-index:5;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.panel{
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.12);
  padding:9px 12px;
  border-radius:12px;
  font-size:14px;
}

#shopBtn{
  pointer-events:auto;
  background:#ffb400;
  color:#111;
  padding:9px 14px;
}

#powerUI{
  position:fixed;
  top:72px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  display:flex;
  gap:5px;
  font-size:12px;
}

.power{
  background:rgba(0,0,0,.65);
  padding:6px 9px;
  border-radius:8px;
  display:none;
}

#joystick{
  position:fixed;
  left:25px;
  bottom:30px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.2);
  z-index:8;
  touch-action:none;
}

#stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,200,0,.78);
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

#boostBtn{
  position:fixed;
  right:30px;
  bottom:45px;
  width:85px;
  height:85px;
  border-radius:50%;
  background:#ff8c00;
  color:#fff;
  font-size:15px;
  z-index:8;
  box-shadow:0 0 25px rgba(255,120,0,.6);
  touch-action:none;
}

#shop,
#gameOver{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  z-index:30;
  display:none;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.modal{
  width:min(420px,95vw);
  background:#151515;
  border:1px solid #333;
  border-radius:20px;
  padding:22px;
  text-align:center;
  box-shadow:0 0 40px rgba(0,0,0,.8);
}

.modal h2{
  color:#ffd400;
  margin-bottom:15px;
}

.shopItem{
  background:#222;
  margin:9px 0;
  padding:13px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.shopItem button{
  background:#ffd000;
  color:#111;
  padding:8px 12px;
}

.closeBtn{
  margin-top:15px;
  background:#444;
  color:#fff;
}

#leaderboard{
  margin-top:10px;
  text-align:left;
  font-size:12px;
  color:#ccc;
}

@media(max-width:600px){
  #menu h1{
    font-size:30px;
  }

  .panel{
    font-size:12px;
    padding:7px 9px;
  }

  #joystick{
    width:110px;
    height:110px;
  }

  #boostBtn{
    width:75px;
    height:75px;
    right:20px;
    bottom:35px;
  }
}
</style>
</head>

<body>

<div id="menu">
  <h1>🐉 DRAGON SNAKE</h1>
  <p>Battle • Survive • Become the Biggest</p>

  <input id="nameInput" maxlength="15" placeholder="Nama pemain">

  <button class="startBtn" onclick="startGame()">
    MULAI GAME
  </button>
</div>


<div id="game">

<canvas id="canvas"></canvas>

<div id="topUI">

  <div class="panel">
    🐉 <b id="playerName">Player</b><br>
    Score: <b id="scoreText">0</b><br>
    Level: <b id="levelText">1</b><br>
    🪙 <b id="coinText">0</b><br>
    🐍 Musuh: <b id="enemyText">0</b>
  </div>

  <button id="shopBtn" onclick="openShop()">
    🛒 SHOP
  </button>

</div>


<div id="powerUI">

  <div class="power" id="magnetUI">
    🧲 <span></span>
  </div>

  <div class="power" id="zoomUI">
    🔭 <span></span>
  </div>

  <div class="power" id="bonusUI">
    💰 5× <span></span>
  </div>

  <div class="power" id="speedUI">
    ⚡ 2× <span></span>
  </div>

</div>


<div id="joystick">
  <div id="stick"></div>
</div>


<button id="boostBtn">
  ⚡ BOOST
</button>

</div>


<div id="shop">

  <div class="modal">

    <h2>🛒 SHOP</h2>

    <div style="margin-bottom:12px">
      🪙 Koin:
      <b id="shopCoins">0</b>
    </div>


    <div class="shopItem">
      <span>
        🧲 Magnet<br>
        <small>Tarik item dari jauh</small>
      </span>

      <button onclick="buyPower('magnet',50)">
        50 🪙
      </button>
    </div>


    <div class="shopItem">
      <span>
        🔭 Zoom<br>
        <small>Penglihatan lebih luas</small>
      </span>

      <button onclick="buyPower('zoom',80)">
        80 🪙
      </button>
    </div>


    <div class="shopItem">
      <span>
        💰 Bonus 5×<br>
        <small>Nilai makanan & koin</small>
      </span>

      <button onclick="buyPower('bonus',100)">
        100 🪙
      </button>
    </div>


    <div class="shopItem">
      <span>
        ⚡ Speed 2×<br>
        <small>Kecepatan meningkat</small>
      </span>

      <button onclick="buyPower('speed',100)">
        100 🪙
      </button>
    </div>


    <button class="closeBtn" onclick="closeShop()">
      TUTUP
    </button>

  </div>

</div>


<div id="gameOver">

  <div class="modal">

    <h2>💀 GAME OVER</h2>

    <p id="finalText"></p>

    <div id="leaderboard"></div>

    <br>

    <button class="startBtn" onclick="restartGame()">
      MAIN LAGI
    </button>

    <button class="closeBtn" onclick="backMenu()">
      MENU
    </button>

  </div>

</div>


<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W,H;

function resize(){

  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;

}

window.addEventListener("resize",resize);

resize();


const WORLD=5000;

let player;
let enemies=[];
let foods=[];
let coins=[];
let particles=[];

let running=false;
let gameTime=0;

let wallet=parseInt(
  localStorage.getItem("dragonCoins") || "0"
);

let magnetTime=0;
let zoomTime=0;
let bonusTime=0;
let speedTime=0;

let joystickX=0;
let joystickY=0;

let boost=false;

const keys={};


/* ================================
   KEYBOARD
================================ */

document.addEventListener("keydown",e=>{

  keys[e.key.toLowerCase()]=true;

  if(e.code==="Space"){

    boost=true;

    e.preventDefault();

  }

});


document.addEventListener("keyup",e=>{

  keys[e.key.toLowerCase()]=false;

  if(e.code==="Space"){

    boost=false;

  }

});


/* ================================
   PLAYER LEVEL
================================ */

function playerLevel(){

  return Math.min(
    10,
    Math.floor(player.score/100)+1
  );

}


/* ================================
   PLAYER SPEED
================================ */

/*
   Setiap 1.000 poin ular sedikit lebih lambat.

   0-999      = 100%
   1000-1999  = 95%
   2000-2999  = 90%
   3000-3999  = 85%
   dst.

   Minimum 55%, supaya tidak terlalu lambat.
*/

function getPlayerSpeed(){

  let base=2.7;

  let thousandSteps=
    Math.floor(player.score/1000);

  let multiplier=
    1-(thousandSteps*0.05);

  multiplier=
    Math.max(0.55,multiplier);

  let result=
    base*multiplier;

  if(speedTime>0){

    result*=2;

  }

  if(boost){

    result*=1.65;

  }

  return result;

}


/* ================================
   CREATE PLAYER
================================ */

function createPlayer(){

  let x=WORLD/2;
  let y=WORLD/2;

  player={

    x:x,
    y:y,

    angle:0,

    radius:17,

    speed:2.7,

    score:0,

    body:[],

    color:"#00d9ff",

    name:
      document.getElementById("nameInput")
      .value
      .trim() || "Player"

  };


  for(let i=0;i<35;i++){

    player.body.push({

      x:x-i*8,
      y:y

    });

  }

}


/* ================================
   CREATE ENEMY
================================ */

function createEnemy(i){

  let angle=
    Math.random()*Math.PI*2;

  let distance=
    700+
    Math.random()*1400;

  let x=
    player.x+
    Math.cos(angle)*distance;

  let y=
    player.y+
    Math.sin(angle)*distance;


  x=
    Math.max(
      200,
      Math.min(WORLD-200,x)
    );

  y=
    Math.max(
      200,
      Math.min(WORLD-200,y)
    );


  let level=playerLevel();


  /*
     Musuh dibuat lebih besar supaya
     tidak mudah mati.
  */

  let enemyScore=
    220+
    level*65+
    Math.random()*250;


  let enemy={

    x:x,
    y:y,

    angle:
      Math.random()*Math.PI*2,

    radius:
      17+
      Math.random()*3,

    score:enemyScore,

    body:[],

    color:[
      "#ff3030",
      "#ff7b00",
      "#b400ff",
      "#00ff66",
      "#ff1493",
      "#ff3333",
      "#00d9ff"
    ][i%7],


    /* AI */

    targetX:x,
    targetY:y,

    thinkTimer:0,

    aggression:
      .85+
      level*.07+
      Math.random()*.3,

    turnSpeed:
      .04+
      Math.random()*.025,

    flankSide:
      Math.random()<.5
      ? -1
      : 1,

    personality:
      Math.random(),

    mode:"hunt",

    surroundTarget:null,

    avoidTimer:0

  };


  let length=
    32+
    Math.floor(enemyScore/13);

  length=
    Math.min(
      120,
      length
    );


  for(let j=0;j<length;j++){

    enemy.body.push({

      x:x-j*8,
      y:y

    });

  }


  return enemy;

}


/* ================================
   FOOD
================================ */

function spawnFood(){

  foods.push({

    x:
      100+
      Math.random()*(WORLD-200),

    y:
      100+
      Math.random()*(WORLD-200),

    value:
      5+
      Math.floor(Math.random()*10),

    size:
      7+
      Math.random()*3

  });

}


/* ================================
   COIN
================================ */

function spawnCoin(){

  coins.push({

    x:
      100+
      Math.random()*(WORLD-200),

    y:
      100+
      Math.random()*(WORLD-200),

    value:
      1+
      Math.floor(Math.random()*3),

    size:7

  });

}


/* ================================
   DISTANCE
================================ */

function dist(ax,ay,bx,by){

  return Math.hypot(
    ax-bx,
    ay-by
  );

}


/* ================================
   ANGLE DIFFERENCE
================================ */

function angleDiff(a,b){

  return Math.atan2(
    Math.sin(b-a),
    Math.cos(b-a)
  );

}


/* ================================
   PLAYER BODY COLLISION
================================ */

function hitPlayerBody(
  x,
  y,
  r=0
){

  for(
    let i=8;
    i<player.body.length;
    i++
  ){

    let p=player.body[i];

    if(
      dist(
        x,
        y,
        p.x,
        p.y
      )
      <
      player.radius+
      r+
      7
    ){

      return true;

    }

  }

  return false;

}


/* ================================
   ENEMY BODY COLLISION
================================ */

function hitEnemyBody(
  enemy,
  x,
  y,
  r=0
){

  for(
    let i=7;
    i<enemy.body.length;
    i++
  ){

    let p=enemy.body[i];

    if(
      dist(
        x,
        y,
        p.x,
        p.y
      )
      <
      enemy.radius+
      r+
      7
    ){

      return true;

    }

  }

  return false;

}


/* ================================
   ENEMY VS ENEMY BODY
================================ */

function hitOtherEnemyBody(
  attacker,
  x,
  y
){

  for(let other of enemies){

    if(other===attacker)
      continue;


    /*
       Mulai dari bagian 7,
       supaya kepala musuh tidak dianggap
       sebagai badan.
    */

    for(
      let j=7;
      j<other.body.length;
      j++
    ){

      let p=other.body[j];

      if(
        dist(
          x,
          y,
          p.x,
          p.y
        )
        <
        attacker.radius+
        other.radius+
        6
      ){

        return other;

      }

    }

  }

  return null;

}


/* ================================
   CHECK FUTURE PLAYER BODY
================================ */

function futurePlayerDanger(
  x,
  y,
  r
){

  return hitPlayerBody(
    x,
    y,
    r
  );

}


/* ================================
   SMART ENEMY AI
================================ */

function updateEnemy(enemy){

  let level=playerLevel();


  enemy.thinkTimer--;


  if(enemy.thinkTimer<=0){

    enemy.thinkTimer=
      Math.max(
        4,
        14-level
      );


    let dx=
      player.x-
      enemy.x;

    let dy=
      player.y-
      enemy.y;

    let distanceToPlayer=
      Math.hypot(dx,dy);


    /* =====================================
       1. CEK BAHAYA BADAN PLAYER
    ===================================== */

    let futureDistance=130;

    let futureX=
      enemy.x+
      Math.cos(enemy.angle)*
      futureDistance;

    let futureY=
      enemy.y+
      Math.sin(enemy.angle)*
      futureDistance;


    let danger=
      futurePlayerDanger(
        futureX,
        futureY,
        enemy.radius
      );


    /* =====================================
       2. CEK BADAN SENDIRI
    ===================================== */

    let selfDanger=false;


    for(
      let j=10;
      j<enemy.body.length;
      j+=3
    ){

      let p=enemy.body[j];

      if(
        dist(
          futureX,
          futureY,
          p.x,
          p.y
        )
        <
        enemy.radius*2.7
      ){

        selfDanger=true;

        break;

      }

    }


    /* =====================================
       3. CEK MUSUH LAIN
    ===================================== */

    let nearbyEnemy=null;
    let nearbyDistance=Infinity;


    for(let other of enemies){

      if(other===enemy)
        continue;

      let d=
        dist(
          enemy.x,
          enemy.y,
          other.x,
          other.y
        );

      if(
        d<500 &&
        d<nearbyDistance
      ){

        nearbyDistance=d;
        nearbyEnemy=other;

      }

    }


    /* =====================================
       4. MUSUH YANG LEBIH LEMAH
       MENGHINDARI KEPALA PLAYER
    ===================================== */

    if(
      enemy.score<
      player.score
    ){

      enemy.mode="flank";


      let sideDistance=
        180+
        level*15;


      let sideAngle=
        player.angle+
        enemy.flankSide*
        Math.PI/2;


      enemy.targetX=
        player.x+
        Math.cos(sideAngle)*
        sideDistance;


      enemy.targetY=
        player.y+
        Math.sin(sideAngle)*
        sideDistance;


      /*
        Jangan masuk terlalu dekat
        dengan kepala pemain.
      */

      if(
        distanceToPlayer<250
      ){

        enemy.targetX=
          player.x+
          Math.cos(sideAngle)*
          220;

        enemy.targetY=
          player.y+
          Math.sin(sideAngle)*
          220;

      }

    }


    /* =====================================
       5. MUSUH KUAT
       BERUSAHA MEMOTONG JALAN
    ===================================== */

    else{

      enemy.mode="attack";


      let prediction=
        100+
        level*15;


      /*
        Target sedikit di depan pemain.
      */

      let predictedX=
        player.x+
        Math.cos(player.angle)*
        prediction;

      let predictedY=
        player.y+
        Math.sin(player.angle)*
        prediction;


      enemy.targetX=
        predictedX;

      enemy.targetY=
        predictedY;


      /*
        Jika terlalu dekat,
        geser ke samping supaya
        tidak mati head-to-head.
      */

      if(
        distanceToPlayer<250
      ){

        let sideAngle=
          player.angle+
          enemy.flankSide*
          Math.PI/2;


        enemy.targetX=
          player.x+
          Math.cos(sideAngle)*
          160;


        enemy.targetY=
          player.y+
          Math.sin(sideAngle)*
          160;

      }

    }


    /* =====================================
       6. MODE MENGURUNG PLAYER
    ===================================== */

    /*
       Sebagian besar musuh yang dekat
       dengan pemain akan mengambil posisi
       berbeda mengelilingi pemain.
    */

    if(
      distanceToPlayer<
      950
    ){

      /*
        Gunakan index musuh untuk menentukan
        posisi pengepungan.
      */

      let myIndex=
        enemies.indexOf(enemy);

      if(myIndex<0)
        myIndex=0;


      let total=
        Math.max(
          1,
          enemies.length
        );


      /*
        Posisi lingkaran di sekitar player.
      */

      let surroundAngle=
        (myIndex/total)*
        Math.PI*2+
        gameTime*.001;


      /*
        Musuh tidak berdiri tepat di kepala.
        Mereka mengambil posisi sekitar player.
      */

      let surroundDistance=
        360+
        (myIndex%3)*90;


      /*
        Jika player besar,
        lingkaran pengepungan sedikit lebih jauh.
      */

      surroundDistance+=
        Math.floor(player.score/1000)*
        25;


      let surroundX=
        player.x+
        Math.cos(surroundAngle)*
        surroundDistance;


      let surroundY=
        player.y+
        Math.sin(surroundAngle)*
        surroundDistance;


      /*
        Kalau jalur menuju titik pengepungan
        aman, gunakan target tersebut.
      */

      let testX=
        enemy.x+
        Math.cos(
          Math.atan2(
            surroundY-enemy.y,
            surroundX-enemy.x
          )
        )*
        100;


      let testY=
        enemy.y+
        Math.sin(
          Math.atan2(
            surroundY-enemy.y,
            surroundX-enemy.x
          )
        )*
        100;


      if(
        !hitPlayerBody(
          testX,
          testY,
          enemy.radius
        )
      ){

        enemy.targetX=surroundX;
        enemy.targetY=surroundY;

      }

    }


    /* =====================================
       7. BAHAYA BADAN PLAYER
    ===================================== */

    if(danger){

      /*
        Jangan tabrak badan player.

        Musuh akan menggeser ke samping,
        kemudian mencari jalur lain.
      */

      enemy.avoidTimer=40;


      let away=
        Math.atan2(
          enemy.y-player.y,
          enemy.x-player.x
        );


      let side=
        away+
        enemy.flankSide*
        Math.PI/2;


      enemy.targetX=
        enemy.x+
        Math.cos(side)*
        350;


      enemy.targetY=
        enemy.y+
        Math.sin(side)*
        350;

    }


    /* =====================================
       8. BADAN SENDIRI
    ===================================== */

    if(selfDanger){

      let escape=
        enemy.angle+
        enemy.flankSide*
        1.3;


      enemy.targetX=
        enemy.x+
        Math.cos(escape)*
        300;


      enemy.targetY=
        enemy.y+
        Math.sin(escape)*
        300;

    }


    /* =====================================
       9. HINDARI MUSUH LAIN
    ===================================== */

    if(
      nearbyEnemy &&
      nearbyDistance<180
    ){

      let escape=
        Math.atan2(
          enemy.y-nearbyEnemy.y,
          enemy.x-nearbyEnemy.x
        );


      enemy.targetX=
        enemy.x+
        Math.cos(escape)*
        300;


      enemy.targetY=
        enemy.y+
        Math.sin(escape)*
        300;

    }


    /* =====================================
       10. MAKANAN
    ===================================== */

    if(
      distanceToPlayer>
      1100
    ){

      let nearestFood=null;
      let foodDistance=Infinity;


      for(let f of foods){

        let d=
          dist(
            enemy.x,
            enemy.y,
            f.x,
            f.y
          );


        if(d<foodDistance){

          foodDistance=d;
          nearestFood=f;

        }

      }


      if(nearestFood){

        enemy.targetX=
          nearestFood.x;

        enemy.targetY=
          nearestFood.y;

      }

    }

  }


  /* =====================================
     MOVEMENT
  ===================================== */

  let targetAngle=
    Math.atan2(
      enemy.targetY-enemy.y,
      enemy.targetX-enemy.x
    );


  let difference=
    angleDiff(
      enemy.angle,
      targetAngle
    );


  let turn=
    enemy.turnSpeed+
    level*.002;


  if(
    enemy.avoidTimer>0
  ){

    enemy.avoidTimer--;

    turn*=1.4;

  }


  if(difference>turn){

    enemy.angle+=turn;

  }
  else if(difference<-turn){

    enemy.angle-=turn;

  }
  else{

    enemy.angle=targetAngle;

  }


  /* =====================================
     HARD SPEED
  ===================================== */

  let speed=
    2.35+
    level*.18+
    enemy.aggression*.25;


  /*
     Musuh yang kuat lebih agresif.
  */

  if(
    enemy.score>=player.score
  ){

    speed*=1.08;

  }


  /*
     Musuh yang sedang mengurung
     sedikit diperlambat agar formasinya
     lebih stabil.
  */

  if(
    enemy.mode==="flank"
  ){

    speed*=.96;

  }


  enemy.x+=
    Math.cos(enemy.angle)*
    speed;


  enemy.y+=
    Math.sin(enemy.angle)*
    speed;


  /* =====================================
     WORLD BORDER
  ===================================== */

  if(enemy.x<100){

    enemy.x=100;
    enemy.angle=0;

  }

  if(enemy.x>WORLD-100){

    enemy.x=WORLD-100;
    enemy.angle=Math.PI;

  }

  if(enemy.y<100){

    enemy.y=100;
    enemy.angle=Math.PI/2;

  }

  if(enemy.y>WORLD-100){

    enemy.y=WORLD-100;
    enemy.angle=-Math.PI/2;

  }


  /* =====================================
     UPDATE BODY
  ===================================== */

  enemy.body[0].x=
    enemy.x;

  enemy.body[0].y=
    enemy.y;


  for(
    let i=1;
    i<enemy.body.length;
    i++
  ){

    let prev=
      enemy.body[i-1];

    let cur=
      enemy.body[i];


    let dx=
      prev.x-cur.x;

    let dy=
      prev.y-cur.y;


    let d=
      Math.hypot(dx,dy);


    if(d>8){

      cur.x+=
        dx/d*(d-8);

      cur.y+=
        dy/d*(d-8);

    }

  }

}


/* ================================
   PLAYER UPDATE
================================ */

function updatePlayer(){

  let dx=0;
  let dy=0;


  if(
    keys["w"]||
    keys["arrowup"]
  )
    dy-=1;


  if(
    keys["s"]||
    keys["arrowdown"]
  )
    dy+=1;


  if(
    keys["a"]||
    keys["arrowleft"]
  )
    dx-=1;


  if(
    keys["d"]||
    keys["arrowright"]
  )
    dx+=1;


  if(
    Math.abs(joystickX)>.1||
    Math.abs(joystickY)>.1
  ){

    dx=joystickX;
    dy=joystickY;

  }


  if(
    dx!==0||
    dy!==0
  ){

    let d=
      Math.hypot(dx,dy);

    dx/=d;
    dy/=d;

    player.angle=
      Math.atan2(dy,dx);

  }


  let speed=
    getPlayerSpeed();


  player.x+=
    Math.cos(player.angle)*
    speed;


  player.y+=
    Math.sin(player.angle)*
    speed;


  /* BORDER */

  player.x=
    Math.max(
      100,
      Math.min(
        WORLD-100,
        player.x
      )
    );


  player.y=
    Math.max(
      100,
      Math.min(
        WORLD-100,
        player.y
      )
    );


  /* BODY */

  player.body[0].x=
    player.x;

  player.body[0].y=
    player.y;


  for(
    let i=1;
    i<player.body.length;
    i++
  ){

    let prev=
      player.body[i-1];

    let cur=
      player.body[i];


    let dx=
      prev.x-cur.x;

    let dy=
      prev.y-cur.y;


    let d=
      Math.hypot(dx,dy);


    if(d>8){

      cur.x+=
        dx/d*(d-8);

      cur.y+=
        dy/d*(d-8);

    }

  }

}


/* ================================
   SUCTION
================================ */

function suctionRange(){

  if(magnetTime>0)
    return 280;

  return player.radius*1.5;

}


function suckItems(){

  let range=
    suctionRange();


  for(let f of foods){

    let d=
      dist(
        player.x,
        player.y,
        f.x,
        f.y
      );


    if(d<range){

      let force=
        magnetTime>0
        ? .12
        : .05;


      f.x+=
        (player.x-f.x)*
        force;


      f.y+=
        (player.y-f.y)*
        force;

    }

  }


  for(let c of coins){

    let d=
      dist(
        player.x,
        player.y,
        c.x,
        c.y
      );


    if(d<range){

      c.x+=
        (player.x-c.x)*
        .14;


      c.y+=
        (player.y-c.y)*
        .14;

    }

  }

}


/* ================================
   EAT FOOD
================================ */

function eatFood(){

  for(
    let i=foods.length-1;
    i>=0;
    i--
  ){

    let f=foods[i];


    if(
      dist(
        player.x,
        player.y,
        f.x,
        f.y
      )
      <
      player.radius+
      f.size+
      5
    ){

      let value=f.value;


      if(bonusTime>0)
        value*=5;


      player.score+=value;


      let add=
        Math.max(
          1,
          Math.floor(value/5)
        );


      for(let j=0;j<add;j++){

        let last=
          player.body[
            player.body.length-1
          ];


        player.body.push({

          x:last.x,
          y:last.y

        });

      }


      foods.splice(i,1);

    }

  }


  for(
    let i=coins.length-1;
    i>=0;
    i--
  ){

    let c=coins[i];


    if(
      dist(
        player.x,
        player.y,
        c.x,
        c.y
      )
      <
      player.radius+
      c.size+
      6
    ){

      let value=c.value;


      if(bonusTime>0)
        value*=5;


      wallet+=value;


      localStorage.setItem(
        "dragonCoins",
        wallet
      );


      coins.splice(i,1);

    }

  }

}


/* ================================
   ENEMY DEATH
================================ */

function killEnemy(enemy){

  let index=
    enemies.indexOf(enemy);


  if(index===-1)
    return;


  createExplosion(
    enemy.x,
    enemy.y,
    enemy.color
  );


  /*
     Pecah menjadi makanan.
  */

  let foodCount=
    Math.min(
      20,
      8+
      Math.floor(enemy.score/120)
    );


  for(
    let k=0;
    k<foodCount;
    k++
  ){

    foods.push({

      x:
        enemy.x+
        (Math.random()-.5)*150,

      y:
        enemy.y+
        (Math.random()-.5)*150,

      value:
        8+
        Math.floor(Math.random()*15),

      size:8

    });

  }


  enemies.splice(
    index,
    1
  );

}


/* ================================
   COLLISION SYSTEM
================================ */

function checkCollisions(){


  /* =================================================
     1. MUSUH VS PLAYER BODY

     KEPALA MUSUH menabrak BADAN PLAYER
     = MUSUH MATI
  ================================================= */

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    let e=enemies[i];


    if(
      hitPlayerBody(
        e.x,
        e.y,
        e.radius
      )
    ){

      let reward=
        Math.floor(
          e.score*.15
        )+
        50;


      player.score+=reward;


      killEnemy(e);


      continue;

    }

  }


  /* =================================================
     2. PLAYER HEAD VS ENEMY BODY

     KEPALA PLAYER menabrak BADAN MUSUH
     = PLAYER MATI
  ================================================= */

  for(let e of enemies){

    if(
      hitEnemyBody(
        e,
        player.x,
        player.y,
        player.radius
      )
    ){

      gameOver();

      return;

    }

  }


  /* =================================================
     3. MUSUH VS MUSUH

     KEPALA MUSUH A menabrak BADAN MUSUH B
     = MUSUH B MATI

     Kepala yang menabrak tetap hidup.
  ================================================= */

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    let attacker=
      enemies[i];


    if(
      !enemies.includes(attacker)
    )
      continue;


    let victim=
      hitOtherEnemyBody(
        attacker,
        attacker.x,
        attacker.y
      );


    if(
      victim &&
      victim!==attacker
    ){

      /*
        Musuh dengan badan lebih panjang
        tetap bisa mati.
      */

      killEnemy(victim);

    }

  }


  /* =================================================
     4. HEAD VS HEAD

     Score lebih besar menang.
  ================================================= */

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    let e=enemies[i];


    if(
      !enemies.includes(e)
    )
      continue;


    let d=
      dist(
        player.x,
        player.y,
        e.x,
        e.y
      );


    if(
      d<
      player.radius+
      e.radius+
      5
    ){

      if(
        player.score>
        e.score
      ){

        player.score+=
          Math.floor(
            e.score*.1
          );


        killEnemy(e);

      }
      else{

        gameOver();

        return;

      }

    }

  }


  /* =================================================
     5. MUSUH HEAD VS MUSUH HEAD

     Musuh yang score lebih besar menang.
  ================================================= */

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    let a=enemies[i];


    if(!a)
      continue;


    for(
      let j=i-1;
      j>=0;
      j--
    ){

      let b=enemies[j];


      if(!b)
        continue;


      let d=
        dist(
          a.x,
          a.y,
          b.x,
          b.y
        );


      if(
        d<
        a.radius+
        b.radius+
        5
      ){

        if(
          a.score>=b.score
        ){

          a.score+=
            Math.floor(
              b.score*.08
            );


          killEnemy(b);

        }
        else{

          b.score+=
            Math.floor(
              a.score*.08
            );


          killEnemy(a);

        }


        break;

      }

    }

  }

}


/* ================================
   EXPLOSION
================================ */

function createExplosion(
  x,
  y,
  color
){

  for(let i=0;i<20;i++){

    particles.push({

      x:x,
      y:y,

      vx:
        (Math.random()-.5)*5,

      vy:
        (Math.random()-.5)*5,

      life:
        30+
        Math.random()*30,

      color:color

    });

  }

}


/* ================================
   PARTICLES
================================ */

function updateParticles(){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    let p=particles[i];


    p.x+=p.vx;
    p.y+=p.vy;


    p.life--;


    if(p.life<=0)
      particles.splice(i,1);

  }

}


/* ================================
   DRAW SNAKE
================================ */

function drawSnake(
  snake,
  isPlayer=false
){

  for(
    let i=snake.body.length-1;
    i>=0;
    i--
  ){

    let p=
      snake.body[i];


    let r=
      snake.radius-
      Math.min(
        3,
        i*.015
      );


    ctx.beginPath();


    ctx.arc(
      p.x,
      p.y,
      Math.max(8,r),
      0,
      Math.PI*2
    );


    ctx.fillStyle=
      isPlayer
      ?
      (
        i%2===0
        ? "#00e5ff"
        : "#008cff"
      )
      :
      snake.color;


    ctx.fill();

  }


  /* HEAD */

  ctx.beginPath();


  ctx.arc(
    snake.x,
    snake.y,
    snake.radius+2,
    0,
    Math.PI*2
  );


  ctx.fillStyle=
    isPlayer
    ? "#00ffff"
    : snake.color;


  ctx.fill();


  /* EYES */

  let ex=
    Math.cos(snake.angle);

  let ey=
    Math.sin(snake.angle);


  let px=-ey;
  let py=ex;


  for(
    let side of [-1,1]
  ){

    ctx.beginPath();


    ctx.arc(
      snake.x+
      ex*8+
      px*side*6,

      snake.y+
      ey*8+
      py*side*6,

      3.5,

      0,
      Math.PI*2
    );


    ctx.fillStyle="white";

    ctx.fill();


    ctx.beginPath();


    ctx.arc(
      snake.x+
      ex*9+
      px*side*6,

      snake.y+
      ey*9+
      py*side*6,

      1.7,

      0,
      Math.PI*2
    );


    ctx.fillStyle="black";

    ctx.fill();

  }

}


/* ================================
   DRAW WORLD
================================ */

function drawWorld(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  let zoom=
    zoomTime>0
    ? .72
    : 1;


  ctx.save();


  ctx.translate(
    W/2,
    H/2
  );


  ctx.scale(
    zoom,
    zoom
  );


  ctx.translate(
    -player.x,
    -player.y
  );


  /* BACKGROUND */

  ctx.fillStyle="#101010";


  ctx.fillRect(
    0,
    0,
    WORLD,
    WORLD
  );


  /* GRID */

  ctx.strokeStyle=
    "rgba(255,255,255,.035)";


  ctx.lineWidth=1;


  for(
    let x=0;
    x<=WORLD;
    x+=100
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      WORLD
    );

    ctx.stroke();

  }


  for(
    let y=0;
    y<=WORLD;
    y+=100
  ){

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      WORLD,
      y
    );

    ctx.stroke();

  }


  /* FOOD */

  for(let f of foods){

    ctx.font=
      `${f.size*2.2}px Arial`;

    ctx.textAlign="center";

    ctx.textBaseline="middle";


    ctx.fillText(
      "🍰",
      f.x,
      f.y
    );

  }


  /* COINS */

  for(let c of coins){

    ctx.beginPath();


    ctx.arc(
      c.x,
      c.y,
      c.size,
      0,
      Math.PI*2
    );


    ctx.fillStyle="#ffd700";

    ctx.fill();


    ctx.strokeStyle="#fff2a0";

    ctx.stroke();


    ctx.fillStyle="#8b6500";


    ctx.font="8px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";


    ctx.fillText(
      "★",
      c.x,
      c.y
    );

  }


  /* ENEMIES */

  for(let e of enemies){

    drawSnake(
      e,
      false
    );


    ctx.font=
      "bold 10px Arial";

    ctx.textAlign="center";

    ctx.fillStyle="#fff";


    let modeText=
      e.mode==="flank"
      ? "FLANK"
      : "HARD";


    ctx.fillText(
      "🐍 "+
      modeText+
      " "+
      Math.floor(e.score),
      e.x,
      e.y-
      e.radius-
      10
    );

  }


  /* PLAYER */

  drawSnake(
    player,
    true
  );


  /* PARTICLES */

  for(let p of particles){

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/50
      );


    ctx.beginPath();


    ctx.arc(
      p.x,
      p.y,
      3,
      0,
      Math.PI*2
    );


    ctx.fillStyle=
      p.color;


    ctx.fill();

  }


  ctx.globalAlpha=1;


  ctx.restore();

}


/* ================================
   POWERS
================================ */

function updatePowers(){

  if(magnetTime>0)
    magnetTime--;

  if(zoomTime>0)
    zoomTime--;

  if(bonusTime>0)
    bonusTime--;

  if(speedTime>0)
    speedTime--;


  updatePowerUI();

}


function updatePowerUI(){

  setPower(
    "magnetUI",
    magnetTime
  );

  setPower(
    "zoomUI",
    zoomTime
  );

  setPower(
    "bonusUI",
    bonusTime
  );

  setPower(
    "speedUI",
    speedTime
  );

}


function setPower(
  id,
  time
){

  let el=
    document.getElementById(id);


  if(time>0){

    el.style.display="block";


    let sec=
      Math.ceil(
        time/60
      );


    el.querySelector(
      "span"
    ).textContent=
      sec+"s";

  }
  else{

    el.style.display="none";

  }

}


/* ================================
   WORLD MAINTAIN
================================ */

function maintainWorld(){

  while(
    foods.length<100
  ){

    spawnFood();

  }


  while(
    coins.length<35
  ){

    spawnCoin();

  }


  let level=
    playerLevel();


  /*
     Musuh bertambah secara bertahap.
  */

  let targetEnemies=
    Math.min(
      12,
      5+
      Math.floor(
        level/2
      )
    );


  while(
    enemies.length<
    targetEnemies
  ){

    enemies.push(
      createEnemy(
        enemies.length
      )
    );

  }

}

   UI
================================ */

function updateUI(){

    "playerName"
  ).textContent=
    player.name;


  document.getElementById(
    "scoreText"
  ).textContent=
    Math.floor(
      player.score
    );


  document.getElementById(
    "levelText"
  ).textContent=
    playerLevel();

    "coinText"
  ).textContent=

  ).textContent=

}


/* ================================
   GAME LOOP
================================ */

function loop(){

  if(!running)
    return;


  gameTime++;


  updatePlayer();


  for(
    let e of enemies
  ){

    updateEnemy(e);

  }


  suckItems();


  eatFood();


  checkCollisions();


  updateParticles();


  updatePowers();


  maintainWorld();


  updateUI();


  drawWorld();


  requestAnimationFrame(
    loop
  );

}


/* ================================
   START GAME
================================ */

function startGame(){

  document.getElementById(
    "menu"
  ).style.display="none";


  document.getElementById(
    "game"
  ).style.display="block";


  document.getElementById(
    "gameOver"
  ).style.display="none";


  running=true;

  gameTime=0;


  magnetTime=0;
  zoomTime=0;
  bonusTime=0;
  speedTime=0;


  foods=[];
  coins=[];
  enemies=[];
  particles=[];


  createPlayer();


  for(
    let i=0;
    i<7;
    i++
  ){

    enemies.push(
      createEnemy(i)
    );

  }


  for(
    let i=0;
    i<120;
    i++
  ){

    spawnFood();

  }


  for(
    let i=0;
    i<40;
    i++
  ){

    spawnCoin();

  }


  updateUI();


  loop();

}


/* ================================
   GAME OVER
================================ */

function gameOver(){

  if(!running)
    return;


  running=false;


  document.getElementById(
    "finalText"
  ).innerHTML=
    `
    <b>${player.name}</b><br>
    Score:
    <b>${Math.floor(player.score)}</b><br>
    Level:
    <b>${playerLevel()}</b>
    `;


  createLeaderboard();


  document.getElementById(
    "gameOver"
  ).style.display="flex";

}


/* ================================
   LEADERBOARD
================================ */

function createLeaderboard(){

  let list=[

    {
      name:player.name,
      score:
        Math.floor(
          player.score
        )
    }

  ];


  for(let e of enemies){

    list.push({

      name:"🐍 HARD AI",

      score:
        Math.floor(
          e.score
        )

    });

  }


  list.sort(
    (a,b)=>
      b.score-a.score
  );


  list=
    list.slice(
      0,
      5
    );


  let html=
    "<b>🏆 SCOREBOARD</b><br><br>";


  list.forEach(
    (x,i)=>{

      html+=
        `${i+1}. ${x.name} — ${x.score}<br>`;

    }
  );


  document.getElementById(
    "leaderboard"
  ).innerHTML=
    html;

}

function buyPower(
  type,
  cost
){

  if(wallet<cost){

    alert(
      "Koin kamu belum cukup!"
    );

    return;

  }


  wallet-=cost;


  localStorage.setItem(
    "dragonCoins",
    wallet
  );


  let duration=
    20*60;


  if(type==="magnet")
    magnetTime=duration;


  if(type==="zoom")
    zoomTime=duration;


  if(type==="bonus")
    bonusTime=duration;


  if(type==="speed")
    speedTime=duration;


  document.getElementById(
    "shopCoins"
  ).textContent=
    wallet;


  updateUI();

}


/* ================================
   JOYSTICK
================================ */

const joystick=
  document.getElementById(
    "joystick"
  );


const stick=
  document.getElementById(
    "stick"
  );


let joyActive=false;


function updateJoystick(e){

  let rect=
    joystick.getBoundingClientRect();


  let cx=
    rect.left+
    rect.width/2;


  let cy=
    rect.top+
    rect.height/2;


  let x=
    e.clientX-cx;

  let y=
    e.clientY-cy;


  let max=
    rect.width/2-27;


  let d=
    Math.hypot(x,y);


  if(d>max){

    x=x/d*max;
    y=y/d*max;

  }


  joystickX=
    x/max;

  joystickY=
    y/max;


  stick.style.left=
    `calc(50% + ${x}px)`;


  stick.style.top=
    `calc(50% + ${y}px)`;

}


joystick.addEventListener(
  "pointerdown",
  e=>{

    joyActive=true;


    joystick.setPointerCapture(
      e.pointerId
    );


    updateJoystick(e);

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(joyActive)
      updateJoystick(e);

  }
);


joystick.addEventListener(
  "pointerup",
  resetJoystick
);


joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


function resetJoystick(){

  joyActive=false;


  joystickX=0;
  joystickY=0;


  stick.style.left="50%";
  stick.style.top="50%";

}


/* ================================
   BOOST
================================ */

const boostBtn=
  document.getElementById(
    "boostBtn"
  );


boostBtn.addEventListener(
  "pointerdown",
  e=>{

    boost=true;

    e.preventDefault();

  }
);


boostBtn.addEventListener(
  "pointerup",
  e=>{

    boost=false;

    e.preventDefault();

  }
);


boostBtn.addEventListener(
  "pointercancel",
  ()=>{

    boost=false;

  }
);


boostBtn.addEventListener(
  "pointerleave",
  ()=>{

    boost=false;

  }
);


/* ================================
   MOUSE PC
================================ */

canvas.addEventListener(
  "mousemove",
  e=>{

    if(!running)
      return;


    let dx=
      e.clientX-W/2;

    let dy=
      e.clientY-H/2;


    if(
      Math.abs(dx)>15||
      Math.abs(dy)>15
    ){

      player.angle=
        Math.atan2(
          dy,
          dx
        );

    }

  }
);


/* ================================
   INITIAL UI
================================ */

document.getElementById(
  "coinText"
).textContent=
  wallet;

</script>
